<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS CLF-C02 최종 파이널 (100문제)</title>
    <style>
        :root {
            --aws-orange: #FF9900;
            --aws-blue: #232F3E;
            --light-bg: #F2F4F8;
            --border-color: #D5DBDB;
            --success: #1D8102;
            --error: #D13212;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--light-bg);
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: var(--aws-blue);
            color: white;
            padding: 20px;
            text-align: center;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        .subtitle { margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.8; }
        
        .tabs {
            display: flex;
            background-color: #eee;
            border-bottom: 2px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            color: #555;
        }
        .tab-btn.active {
            background-color: white;
            color: var(--aws-orange);
            border-bottom: 3px solid var(--aws-orange);
        }
        .tab-btn:hover:not(.active) {
            background-color: #e0e0e0;
        }

        .quiz-content { padding: 30px; flex: 1; display: flex; flex-direction: column; }
        
        /* 진행바 스타일 */
        .progress-container {
            margin-bottom: 20px;
            background-color: #eee;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--aws-orange);
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            text-align: right;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 10px;
        }

        .question-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 25px;
            margin-bottom: 20px;
            flex: 1;
        }
        .q-meta {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background-color: #E7F2FA;
            color: #0073BB;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .q-text { font-size: 1.25rem; font-weight: 600; margin-bottom: 25px; }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .options label {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .options label:hover { background-color: #f9f9f9; border-color: #ccc; }
        .options label.selected { border-color: var(--aws-orange); background-color: #fff8e6; }
        .options input { margin-right: 15px; transform: scale(1.3); }

        /* 힌트 박스 */
        .hint-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 4px solid #17a2b8;
            border-radius: 4px;
            display: none;
            animation: fadeIn 0.3s;
        }
        .hint-btn {
            background: none;
            border: none;
            color: #0073bb;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            font-size: 0.9rem;
            text-decoration: underline;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* 네비게이션 버튼 */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .nav-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #333;
        }
        .nav-btn:hover { background-color: #d0d0d0; }
        .nav-btn.primary { background-color: var(--aws-orange); color: white; }
        .nav-btn.primary:hover { background-color: #ec8d00; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 결과 화면 */
        #result-screen { display: none; padding: 30px; text-align: center; }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            font-weight: bold;
        }
        .pass { border-color: var(--success); color: var(--success); }
        .fail { border-color: var(--error); color: var(--error); }
        
        .wrong-note-area { text-align: left; margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px; }
        .note-item {
            background: #FFF5F5;
            border-left: 4px solid var(--error);
            padding: 15px;
            margin-bottom: 15px;
        }
        .explanation {
            margin-top: 8px;
            font-size: 0.95rem;
            color: #444;
            background: rgba(255,255,255,0.7);
            padding: 10px;
            border-radius: 4px;
        }
        .copy-btn { width: 100%; padding: 15px; background-color: #545b62; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AWS Cloud Practitioner (D-1)</h1>
        <p class="subtitle">총 100문항 (Standard 50 / Advanced 50)</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('standard')">기본 모의고사 (50문항)</button>
        <button class="tab-btn" onclick="switchTab('advanced')">심화 학습 (50문항)</button>
    </div>

    <!-- 퀴즈 화면 -->
    <div id="quiz-screen" class="quiz-content">
        <div class="progress-text" id="progress-text">1 / 50</div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div id="question-area">
            <!-- 질문 카드가 여기에 렌더링됩니다 -->
        </div>

        <div class="nav-buttons">
            <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">이전</button>
            <button class="nav-btn primary" id="next-btn" onclick="nextQuestion()">다음</button>
        </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen">
        <h2>시험 결과</h2>
        <div id="score-circle" class="score-circle">0점</div>
        <h3 id="result-msg"></h3>
        
        <div style="display:flex; gap:10px; justify-content: center; margin-bottom: 20px;">
            <button class="nav-btn" style="background-color:var(--aws-blue); color:white;" onclick="resetQuiz()">다시 풀기 (랜덤 재배치)</button>
        </div>

        <div id="wrong-note-container" class="wrong-note-area" style="display:none;">
            <h3>📝 오답 노트</h3>
            <button class="copy-btn" onclick="copyWrongNotes()">오답노트 복사하기</button>
            <div id="wrong-list" style="margin-top:20px;"></div>
        </div>
    </div>
</div>

<script>
    // h: 힌트 추가
    const standardData = [
        { c: "Cloud Concepts", q: "AWS 클라우드 가치 제안 중 초기 투자 비용 없이 사용한 만큼 지불하는 방식은?", a: ["가변 비용", "고정 비용", "총 소유 비용", "예약 비용"], correct: "가변 비용", exp: "초기 데이터 센터 구축 비용(CapEx) 없이 사용량에 따른 운영 비용(OpEx)을 지불합니다.", h: "전기 요금처럼 쓴 만큼만 냅니다." },
        { c: "Cloud Concepts", q: "수요 변화에 따라 리소스를 자동으로 확장/축소할 수 있는 클라우드의 특징은?", a: ["탄력성(Elasticity)", "신뢰성(Reliability)", "보안(Security)", "민첩성(Agility)"], correct: "탄력성(Elasticity)", exp: "필요할 때 자원을 늘리고 필요 없을 때 줄이는 능력입니다.", h: "고무줄처럼 늘어났다 줄어들었다 하는 성질을 생각해보세요." },
        { c: "Cloud Concepts", q: "전 세계 여러 지역에 리소스를 몇 분 만에 배포할 수 있는 능력은?", a: ["글로벌 확장성", "고가용성", "내결함성", "보안성"], correct: "글로벌 확장성", exp: "AWS 글로벌 인프라를 통해 전 세계에 빠르게 배포 가능합니다.", h: "전 세계(Global) 범위로 뻗어나가는 능력입니다." },
        { c: "Cloud Concepts", q: "고객이 하드웨어 관리 없이 애플리케이션 개발에 집중할 수 있게 하는 모델은?", a: ["PaaS", "IaaS", "SaaS", "On-premise"], correct: "PaaS", exp: "Platform as a Service는 인프라 관리를 AWS가 하고 고객은 코드와 데이터만 관리합니다.", h: "플랫폼(Platform)만 빌려 쓰는 형태입니다." },
        { c: "Cloud Concepts", q: "Gmail이나 Dropbox처럼 소프트웨어 전체를 인터넷을 통해 제공받는 모델은?", a: ["SaaS", "PaaS", "IaaS", "DBaaS"], correct: "SaaS", exp: "Software as a Service는 최종 사용자에게 완전한 제품을 제공합니다.", h: "소프트웨어(Software) 완제품을 서비스로 받습니다." },
        { c: "Technology", q: "가상 서버를 임대하여 사용할 수 있는 AWS의 가장 기본적인 컴퓨팅 서비스는?", a: ["EC2", "Lambda", "Lightsail", "Batch"], correct: "EC2", exp: "Elastic Compute Cloud는 크기 조정 가능한 컴퓨팅 파워를 제공합니다.", h: "가상 '컴퓨터(Compute)' 클라우드입니다." },
        { c: "Technology", q: "코드만 업로드하면 서버 관리 없이 실행되는 이벤트 기반 서비스는?", a: ["Lambda", "EC2", "ECS", "Fargate"], correct: "Lambda", exp: "서버리스 컴퓨팅의 대표적인 서비스입니다.", h: "그리스 문자 '람다(λ)'를 사용하는 함수형 서비스입니다." },
        { c: "Technology", q: "무제한 확장이 가능한 객체 스토리지 서비스는?", a: ["S3", "EBS", "EFS", "Instance Store"], correct: "S3", exp: "Simple Storage Service는 인터넷 규모의 스토리지입니다.", h: "Simple Storage Service의 약자입니다." },
        { c: "Technology", q: "EC2 인스턴스에 연결하여 사용하는 블록 스토리지(가상 하드디스크)는?", a: ["EBS", "S3", "Glacier", "EFS"], correct: "EBS", exp: "Elastic Block Store는 단일 EC2 인스턴스에 연결되는 영구 블록 스토리지입니다.", h: "블록(Block) 단위로 저장하는 스토리지입니다." },
        { c: "Technology", q: "관계형 데이터베이스(MySQL 등)를 쉽게 설정하고 운영해주는 관리형 서비스는?", a: ["RDS", "DynamoDB", "Redshift", "ElastiCache"], correct: "RDS", exp: "Relational Database Service입니다.", h: "관계형(Relational) DB 서비스입니다." },
        { c: "Technology", q: "Key-Value 형태의 NoSQL 데이터베이스 서비스는?", a: ["DynamoDB", "RDS", "Aurora", "Neptune"], correct: "DynamoDB", exp: "빠르고 유연한 NoSQL 데이터베이스입니다.", h: "다이나믹하게 확장되는 NoSQL DB입니다." },
        { c: "Technology", q: "격리된 가상 네트워크 환경을 구성할 수 있는 서비스는?", a: ["VPC", "Direct Connect", "Route 53", "CloudFront"], correct: "VPC", exp: "Virtual Private Cloud는 논리적으로 격리된 네트워크를 제공합니다.", h: "가상(Virtual) 사설(Private) 클라우드입니다." },
        { c: "Technology", q: "도메인 이름을 IP 주소로 변환해주는 DNS 웹 서비스는?", a: ["Route 53", "VPC", "CloudFront", "Direct Connect"], correct: "Route 53", exp: "가용성과 확장성이 뛰어난 클라우드 DNS 서비스입니다.", h: "DNS 포트 번호 53번을 떠올리세요." },
        { c: "Technology", q: "콘텐츠를 전 세계 사용자에게 빠르게 전송하기 위한 CDN 서비스는?", a: ["CloudFront", "Route 53", "Global Accelerator", "S3"], correct: "CloudFront", exp: "엣지 로케이션을 사용하여 콘텐츠를 캐싱하고 전송합니다.", h: "구름(Cloud) 앞(Front)에서 빠르게 배달합니다." },
        { c: "Technology", q: "들어오는 트래픽을 여러 대상(EC2 등)으로 자동으로 분산시키는 서비스는?", a: ["ELB (Elastic Load Balancing)", "Auto Scaling", "Route 53", "CloudWatch"], correct: "ELB (Elastic Load Balancing)", exp: "부하 분산을 통해 가용성을 높입니다.", h: "부하(Load)를 균형있게(Balancing) 맞춰줍니다." },
        { c: "Technology", q: "수요에 따라 EC2 인스턴스 수를 자동으로 늘리거나 줄이는 서비스는?", a: ["Auto Scaling", "ELB", "CloudFormation", "Config"], correct: "Auto Scaling", exp: "가용성을 유지하고 비용을 최적화합니다.", h: "자동으로(Auto) 규모(Scaling)를 조절합니다." },
        { c: "Security", q: "AWS 리소스에 대한 접근 권한(사용자, 그룹, 역할)을 관리하는 서비스는?", a: ["IAM", "Inspector", "Shield", "Macie"], correct: "IAM", exp: "Identity and Access Management는 보안의 핵심입니다.", h: "신원(Identity)과 접근(Access)을 관리합니다." },
        { c: "Security", q: "IAM에서 '최소 권한의 원칙'이란?", a: ["업무 수행에 꼭 필요한 권한만 부여", "모든 권한 부여 후 차단", "루트 사용자 공유", "항상 관리자 권한 부여"], correct: "업무 수행에 꼭 필요한 권한만 부여", exp: "보안 모범 사례로, 필요한 것보다 많은 권한을 주지 않는 것입니다.", h: "딱 필요한 만큼만 주는 것입니다." },
        { c: "Security", q: "EC2 인스턴스 레벨에서 트래픽을 제어하는 가상 방화벽은?", a: ["Security Group", "NACL", "WAF", "Shield"], correct: "Security Group", exp: "상태 저장(Stateful) 방식의 인스턴스 방화벽입니다.", h: "인스턴스를 그룹지어 보안(Security)을 설정합니다." },
        { c: "Security", q: "서브넷 레벨에서 트래픽을 제어하는 방화벽은?", a: ["NACL (Network ACL)", "Security Group", "Inspector", "GuardDuty"], correct: "NACL (Network ACL)", exp: "상태 비저장(Stateless) 방식의 서브넷 방화벽입니다.", h: "네트워크 접근 제어 목록(ACL)입니다." },
        { c: "Security", q: "DDoS 공격으로부터 애플리케이션을 보호하는 서비스는?", a: ["Shield", "WAF", "Inspector", "Macie"], correct: "Shield", exp: "Standard(무료)와 Advanced(유료)가 있습니다.", h: "공격을 막아주는 방패(Shield)입니다." },
        { c: "Security", q: "웹 취약점(SQL 인젝션 등)으로부터 웹 애플리케이션을 보호하는 방화벽은?", a: ["WAF", "Shield", "Firewall Manager", "GuardDuty"], correct: "WAF", exp: "Web Application Firewall입니다.", h: "웹(Web) 애플리케이션 방화벽입니다." },
        { c: "Billing", q: "AWS 비용 및 사용량을 시각화하고 분석할 수 있는 도구는?", a: ["Cost Explorer", "Budgets", "Pricing Calculator", "Marketplace"], correct: "Cost Explorer", exp: "과거 사용량 분석 및 향후 3개월 예측이 가능합니다.", h: "비용(Cost)을 탐험(Explorer)하며 분석합니다." },
        { c: "Billing", q: "비용이나 사용량이 설정한 임계값을 초과할 때 알림을 보내는 서비스는?", a: ["Budgets", "Cost Explorer", "CloudWatch", "SNS"], correct: "Budgets", exp: "예산 관리에 필수적입니다.", h: "예산(Budget)을 관리합니다." },
        { c: "Billing", q: "AWS 서비스를 사용하기 전에 예상 비용을 산출해볼 수 있는 도구는?", a: ["Pricing Calculator", "TCO Calculator", "Cost Explorer", "Budgets"], correct: "Pricing Calculator", exp: "아키텍처 구성에 따른 견적을 낼 때 사용합니다.", h: "계산기(Calculator)입니다." },
        { c: "Billing", q: "여러 계정의 결제를 하나로 통합하여 볼륨 할인을 받을 수 있는 기능은?", a: ["Consolidated Billing", "Cost Allocation Tags", "Savings Plans", "Budgets"], correct: "Consolidated Billing", exp: "AWS Organizations의 주요 기능 중 하나입니다.", h: "통합(Consolidated) 결제(Billing)입니다." },
        { c: "Billing", q: "온프레미스와 AWS 간의 비용을 비교하여 절감 효과를 보여주는 도구는?", a: ["TCO Calculator", "Pricing Calculator", "Cost Explorer", "Budgets"], correct: "TCO Calculator", exp: "총 소유 비용(Total Cost of Ownership) 비교 도구입니다.", h: "소유 비용(TCO)을 계산합니다." },

        { c: "Billing", q: "비용을 부서, 프로젝트, 환경 별로 분류하기 위해 리소스에 붙이는 메타데이터는?", a: ["Cost Allocation Tags", "IAM Policies", "Resource Groups", "CloudTrail"], correct: "Cost Allocation Tags", exp: "비용 할당 태그를 활성화해야 청구서에서 구분 가능합니다.", h: "태그(Tag)를 붙입니다." },

        { c: "Management", q: "승인된 IT 서비스 제품(EC2, S3 구성 등)을 카탈로그로 만들어 사용자가 배포하게 하는 서비스는?", a: ["Service Catalog", "Marketplace", "Systems Manager", "Config"], correct: "Service Catalog", exp: "조직 내 표준 준수를 돕습니다.", h: "서비스 목록(Catalog)을 제공합니다." },
        { c: "Management", q: "여러 AWS 계정의 보안 정책을 중앙에서 설정하고 관리하는 '환경 설정' 서비스는?", a: ["Control Tower", "Organizations", "Config", "Trusted Advisor"], correct: "Control Tower", exp: "Landing Zone을 자동으로 설정합니다.", h: "관제탑(Control Tower)에서 전체를 조망합니다." },
        { c: "Management", q: "EC2 인스턴스나 온프레미스 서버를 에이전트를 통해 패치, 구성 관리하는 서비스는?", a: ["Systems Manager", "OpsWorks", "Config", "CloudWatch"], correct: "Systems Manager", exp: "SSM Agent를 사용합니다.", h: "시스템(System)을 관리(Manager)합니다." },

        { c: "DevOps", q: "코드를 컴파일하고 테스트하여 배포 패키지를 만드는 빌드 서비스는?", a: ["CodeBuild", "CodeCommit", "CodeDeploy", "Jenkins"], correct: "CodeBuild", exp: "서버리스 빌드 서비스입니다.", h: "코드를 빌드(Build)합니다." },
        { c: "DevOps", q: "애플리케이션 배포를 자동화하는 서비스는?", a: ["CodeDeploy", "CodeBuild", "CloudFormation", "OpsWorks"], correct: "CodeDeploy", exp: "EC2, Lambda, 온프레미스 등에 배포합니다.", h: "코드를 배포(Deploy)합니다." },
        { c: "DevOps", q: "릴리스 파이프라인(빌드-테스트-배포)을 시각화하고 자동화하는 서비스는?", a: ["CodePipeline", "Step Functions", "X-Ray", "CodeStar"], correct: "CodePipeline", exp: "CI/CD 파이프라인을 구축합니다.", h: "파이프라인(Pipeline)을 만듭니다." },
        { c: "DevOps", q: "분산 애플리케이션의 디버깅 및 트레이싱을 돕는 서비스는?", a: ["X-Ray", "CloudWatch", "CloudTrail", "Inspector"], correct: "X-Ray", exp: "요청이 애플리케이션을 통과하는 경로를 추적합니다.", h: "X-Ray 찍듯이 내부를 들여다봅니다." },
        { c: "AI/ML", q: "기계 학습 모델을 구축, 훈련, 배포하는 완전 관리형 서비스는?", a: ["SageMaker", "Rekognition", "Polly", "Lex"], correct: "SageMaker", exp: "ML 개발자를 위한 통합 환경입니다.", h: "현자(Sage)가 만드는 것(Maker)입니다." },
        { c: "AI/ML", q: "이미지 및 비디오 분석(얼굴 인식 등)을 제공하는 AI 서비스는?", a: ["Rekognition", "SageMaker", "Textract", "Polly"], correct: "Rekognition", exp: "시각적 분석 서비스입니다.", h: "인식(Recognition)에서 이름을 따왔습니다." },
        { c: "AI/ML", q: "텍스트를 음성으로 변환(TTS)해주는 서비스는?", a: ["Polly", "Transcribe", "Lex", "Connect"], correct: "Polly", exp: "Lifelike한 음성을 생성합니다.", h: "앵무새 이름(Polly)입니다." },
        { c: "AI/ML", q: "음성을 텍스트로 변환(STT)해주는 서비스는?", a: ["Transcribe", "Polly", "Translate", "Comprehend"], correct: "Transcribe", exp: "음성 인식 서비스입니다.", h: "받아적다(Transcribe)라는 뜻입니다." },
        { c: "Etc", q: "클라우드 마이그레이션을 가속화하기 위해 AWS 파트너와 전문가의 도움을 받는 프로그램은?", a: ["AWS Professional Services", "AWS Support", "TAM", "Marketplace"], correct: "AWS Professional Services", exp: "Global 팀으로, 고객의 클라우드 도입을 돕습니다.", h: "전문가(Professional) 서비스입니다." }
    ];

    let currentMode = 'standard';
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let userAnswers = {}; // { index: "Selected Answer" }
    
    function shuffleArray(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    function switchTab(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if(mode === 'standard') document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        else document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        resetQuiz();
    }

    function resetQuiz() {
        document.getElementById('quiz-screen').style.display = 'flex';
        document.getElementById('result-screen').style.display = 'none';

        const sourceData = currentMode === 'standard' ? standardData : advancedData;
        
        // 데이터 준비
        currentQuestions = shuffleArray(sourceData);
        // 보기 순서도 미리 섞어둠 (렌더링 시 섞으면 뒤로가기 했을 때 바뀜)
        currentQuestions.forEach(q => {
            q.shuffledOptions = shuffleArray(q.a);
        });

        currentQuestionIndex = 0;
        userAnswers = {};
        
        loadQuestion(0);
    }

    function loadQuestion(index) {
        const item = currentQuestions[index];
        const container = document.getElementById('question-area');
        
        // 진행상황 업데이트
        const total = currentQuestions.length;
        document.getElementById('progress-text').innerText = `문제 ${index + 1} / ${total}`;
        document.getElementById('progress-bar').style.width = `${((index + 1) / total) * 100}%`;

        // 버튼 상태 업데이트
        document.getElementById('prev-btn').disabled = index === 0;
        const nextBtn = document.getElementById('next-btn');
        if (index === total - 1) {
            nextBtn.innerText = "제출 및 채점";
            nextBtn.onclick = submitQuiz;
        } else {
            nextBtn.innerText = "다음";
            nextBtn.onclick = nextQuestion;
        }

        // 렌더링
        let optionsHTML = '';
        const savedAnswer = userAnswers[index]; // 이전에 선택한 답

        item.shuffledOptions.forEach(opt => {
            const isChecked = savedAnswer === opt ? 'checked' : '';
            const isSelectedClass = savedAnswer === opt ? 'selected' : '';
            optionsHTML += `
                <label class="${isSelectedClass}" onclick="selectOption(this, '${opt}')">
                    <input type="radio" name="current_q" value="${opt}" ${isChecked}>
                    <span>${opt}</span>
                </label>
            `;
        });

        container.innerHTML = `
            <div class="question-card">
                <div class="q-meta">
                    <span class="badge">${item.c}</span>
                    <button class="hint-btn" onclick="toggleHint()">💡 힌트 보기</button>
                </div>
                <div class="q-text">Q${index + 1}. ${item.q}</div>
                <div class="options">${optionsHTML}</div>
                <div id="hint-display" class="hint-box">
                    <strong>Hint:</strong> ${item.h || "힌트가 없는 문제입니다."}
                </div>
            </div>
        `;
    }

    function selectOption(labelElement, value) {
        // UI 업데이트
        document.querySelectorAll('.options label').forEach(lbl => lbl.classList.remove('selected'));
        labelElement.classList.add('selected');
        labelElement.querySelector('input').checked = true;
        
        // 답안 저장
        userAnswers[currentQuestionIndex] = value;
    }

    function toggleHint() {
        const hintBox = document.getElementById('hint-display');
        if (hintBox.style.display === 'block') {
            hintBox.style.display = 'none';
        } else {
            hintBox.style.display = 'block';
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < currentQuestions.length - 1) {
            currentQuestionIndex++;
            loadQuestion(currentQuestionIndex);
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion(currentQuestionIndex);
        }
    }

    function submitQuiz() {
        let score = 0;
        let wrongNotes = [];
        let total = currentQuestions.length;
        let unansweredCount = 0;

        currentQuestions.forEach((item, index) => {
            const myAnswer = userAnswers[index];
            
            if (!myAnswer) unansweredCount++;

            if(myAnswer === item.correct) {
                score++;
            } else {
                wrongNotes.push({
                    q: item.q,
                    my: myAnswer || "선택 안 함",
                    correct: item.correct,
                    exp: item.exp
                });
            }
        });

        if(unansweredCount > 0) {
            if(!confirm(`아직 풀지 않은 문제가 ${unansweredCount}개 있습니다. 정말 제출하시겠습니까?`)) return;
        }

        const finalScore = Math.round((score / total) * 100);
        const passed = finalScore >= 70;

        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const circle = document.getElementById('score-circle');
        circle.innerText = `${finalScore}점`;
        circle.className = `score-circle ${passed ? 'pass' : 'fail'}`;

        document.getElementById('result-msg').innerHTML = passed 
            ? "축하합니다! 합격 안정권입니다. 🎉" 
            : `불합격입니다. ${total - score}문제를 더 맞혀야 합니다. 💪`;

        const wrongContainer = document.getElementById('wrong-note-container');
        const wrongList = document.getElementById('wrong-list');
        wrongList.innerHTML = '';

        if(wrongNotes.length > 0) {
            wrongContainer.style.display = 'block';
            wrongNotes.forEach((note, idx) => {
                const div = document.createElement('div');
                div.className = 'note-item';
                div.innerHTML = `
                    <strong>Q. ${note.q}</strong><br>
                    <span style="color:#d13212; text-decoration:line-through">내 답: ${note.my}</span><br>
                    <span style="color:#1d8102; font-weight:bold">정답: ${note.correct}</span>
                    <div class="explanation">💡 <b>해설:</b> ${note.exp}</div>
                `;
                wrongList.appendChild(div);
            });
        } else {
            wrongContainer.style.display = 'none';
        }
    }

    function copyWrongNotes() {
        const list = document.getElementById('wrong-list');
        if(!list.innerText) return;
        let textToCopy = `[AWS CLF-C02 오답노트 (${currentMode})]\n\n`;
        list.querySelectorAll('.note-item').forEach((item, idx) => {
            const q = item.querySelector('strong').innerText;
            const correct = item.querySelector('span:nth-of-type(2)').innerText;
            const exp = item.querySelector('.explanation').innerText;
            textToCopy += `${idx+1}. ${q}\n${correct}\n${exp}\n\n`;
        });
        navigator.clipboard.writeText(textToCopy).then(() => alert("오답노트 복사 완료!"));
    }

    // 초기 실행
    window.onload = resetQuiz;
</script>
