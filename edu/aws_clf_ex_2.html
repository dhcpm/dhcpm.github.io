<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS CLF 심화 모의고사 (DONGGYUN님 전용 v3)</title>
    <style>
        :root {
            --aws-orange: #FF9900;
            --aws-blue: #232F3E;
            --light-gray: #EAEDED;
            --correct-green: #1d8102;
            --wrong-red: #d13212;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-gray);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            width: 100%;
            max-width: 900px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        h1 {
            color: var(--aws-blue);
            text-align: center;
            border-bottom: 3px solid var(--aws-orange);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--aws-orange);
            color: var(--aws-blue);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin: 5px;
        }
        .btn:hover {
            background-color: #ffac31;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--aws-blue);
            color: var(--aws-blue);
        }
        .btn-outline:hover {
            background-color: #f4f4f4;
        }
        
        /* Quiz Section */
        .question-box { display: none; }
        .question-meta {
            display: flex;
            justify-content: space-between;
            color: #555;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .question-text {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #333;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-label {
            background-color: #fff;
            padding: 18px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s;
            position: relative;
        }
        .option-label:hover {
            background-color: #f8f9fa;
            border-color: var(--aws-orange);
        }
        .option-label.selected {
            border-color: var(--aws-orange);
            background-color: #fff8e1;
        }
        .option-label input {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            accent-color: var(--aws-orange);
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }
        
        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #e1e4e8;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: var(--aws-blue);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Result Section */
        .result-box { display: none; text-align: center; }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #f8f9fa;
            border: 5px solid var(--aws-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 2.5em;
            font-weight: bold;
            color: var(--aws-blue);
        }
        .pass-status {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .pass { color: var(--correct-green); }
        .fail { color: var(--wrong-red); }

        /* Review Section */
        .review-box {
            display: none;
            text-align: left;
            margin-top: 30px;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 20px;
            background: #fafafa;
        }
        .review-item {
            background: white;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .review-q-text { font-weight: bold; font-size: 1.1em; margin-bottom: 10px; }
        .review-ans-row { margin: 5px 0; }
        .review-my-ans { color: var(--wrong-red); font-weight: bold; }
        .review-correct-ans { color: var(--correct-green); font-weight: bold; }
        .rationale {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 0.95em;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .hint-section { margin-top: 15px; }
        .hint-btn {
            background: none;
            border: none;
            color: #0073bb;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .hint-text {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 4px;
            color: #856404;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>AWS CLF 심화 모의고사 v3</h1>
        <div style="text-align: center; margin: 30px 0;">
            <p style="font-size: 1.2em; line-height: 1.8;">
                <strong>목표:</strong> 컴퓨팅, 네트워크, 보안 집중 공략<br>
                <strong>난이도:</strong> <span style="color:red;">High (심화)</span><br>
                <strong>문항수:</strong> 50문항 (랜덤 셔플)<br>
                <strong>합격점:</strong> 70점 이상 (35개 정답)
            </p>
            <p style="color: #666; font-size: 0.9em;">
                * 매 시험마다 문제와 보기의 순서가 무작위로 변경됩니다.
            </p>
        </div>
        <div style="text-align: center;">
            <button class="btn" onclick="startQuiz()">시험 시작 (Start Quiz)</button>
        </div>
    </div>

    <div id="quiz-screen" class="question-box">
        <div class="progress-container">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="question-meta">
            <span>DONGGYUN님의 시험 진행중...</span>
            <span>문제 <strong id="q-number" style="color:var(--aws-orange); font-size:1.2em;">1</strong> / 50</span>
        </div>

        <div class="question-text" id="q-text"></div>
        
        <div class="options-container" id="options-area">
            </div>

        <div class="hint-section">
            <button class="hint-btn" onclick="toggleHint()">💡 힌트 보기 (Click for Hint)</button>
            <div class="hint-text" id="q-hint"></div>
        </div>

        <div class="controls">
            <button class="btn btn-outline" id="prev-btn" onclick="prevQuestion()" disabled>이전 (Prev)</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()">다음 (Next)</button>
        </div>
    </div>

    <div id="result-screen" class="result-box">
        <h1>시험 결과 (Result)</h1>
        <div class="score-circle">
            <span id="score">0</span>
        </div>
        <div class="pass-status" id="pass-status"></div>
        <p id="score-detail" style="font-size: 1.1em; color:#555;"></p>
        
        <div style="margin-top: 30px;">
            <button class="btn" onclick="restartQuiz()">🔄 새로운 시험 시작 (Shuffle & Restart)</button>
            <button class="btn btn-outline" onclick="showReview()">❌ 오답 노트 확인 (Review)</button>
        </div>

        <div id="review-area" class="review-box"></div>
    </div>
</div>

<script>
    // 50문항 심화 데이터셋 (컴퓨팅, 네트워크, 보안 비중 강화)
    // 정답은 options 배열의 0번째 인덱스로 작성되어 있으나, 실행 시 섞임.
    const rawQuestions = [
        // --- Computing (심화) ---
        {
            q: "한 회사가 3년 동안 중단 없이 실행되어야 하는 데이터베이스 워크로드를 가지고 있습니다. 이 회사는 특정 인스턴스 패밀리에 얽매이지 않고 나중에 인스턴스 유형을 변경할 수 있는 유연성을 원합니다. 가장 비용 효율적인 EC2 요금제는 무엇입니까?",
            options: ["Convertible Reserved Instances (전환형 예약 인스턴스)", "Standard Reserved Instances (표준 예약 인스턴스)", "Compute Savings Plans", "Spot Instances"],
            answer: 0,
            rationale: "전환형 RI(Convertible RI)는 표준 RI보다 할인율은 약간 낮지만, 약정 기간 동안 인스턴스 패밀리, OS 등을 변경할 수 있는 유연성을 제공합니다.",
            hint: "3년 약정이지만 나중에 '바꿀 수 있는(Convertible)' 옵션이 필요합니다."
        },
        {
            q: "개발자가 서버를 프로비저닝하거나 관리하지 않고 컨테이너화된 애플리케이션을 실행하려고 합니다. 이 요구사항을 충족하는 AWS 서비스는 무엇입니까?",
            options: ["AWS Fargate", "Amazon EC2", "Amazon ECS on EC2", "Amazon EKS on EC2"],
            answer: 0,
            rationale: "Fargate는 Amazon ECS 및 EKS와 작동하는 서버리스 컴퓨팅 엔진으로, 기본 인프라(EC2)를 관리할 필요가 없습니다.",
            hint: "컨테이너를 위한 '서버리스' 엔진입니다."
        },
        {
            q: "사용자는 간헐적으로 발생하고 예측 불가능한 트래픽을 가진 애플리케이션을 AWS Lambda로 호스팅하고 있습니다. Lambda의 과금 기준에 포함되는 두 가지 요소는 무엇입니까?",
            options: ["요청 수(Requests) 및 코드 실행 시간(Duration)", "함수 생성 시간 및 메모리 할당량", "데이터 전송량(Inbound) 및 CPU 코어 수", "Lambda 함수 개수 및 스토리지 용량"],
            answer: 0,
            rationale: "Lambda는 함수가 호출된 횟수(요청 수)와 코드가 실행된 시간(밀리초 단위, 메모리 할당량에 따라 단가 변동)에 대해 과금합니다.",
            hint: "몇 번 불렀는지, 얼마나 오래 실행됐는지가 중요합니다."
        },
        {
            q: "어떤 기업이 대규모의 과학적 계산을 수행하기 위해 수만 개의 배치 작업을 처리해야 합니다. 인프라를 자동으로 프로비저닝하고 작업을 최적화해 주는 서비스는?",
            options: ["AWS Batch", "AWS Lambda", "Amazon EC2 Auto Scaling", "AWS Step Functions"],
            answer: 0,
            rationale: "AWS Batch는 제출된 작업의 볼륨과 리소스 요구 사항에 따라 컴퓨팅 리소스를 동적으로 프로비저닝하는 완전 관리형 배치 처리 서비스입니다.",
            hint: "일괄(Batch) 처리 작업을 위한 전용 서비스입니다."
        },
        {
            q: "애플리케이션의 고가용성을 보장하기 위해 EC2 인스턴스를 여러 가용 영역(AZ)에 분산 배치했습니다. 트래픽을 건강한 인스턴스로만 전달하기 위해 필요한 서비스는 무엇입니까?",
            options: ["Elastic Load Balancing (ELB)", "Amazon Route 53", "AWS Auto Scaling", "Amazon CloudFront"],
            answer: 0,
            rationale: "ELB는 들어오는 트래픽을 여러 대상(EC2 등)에 분산하고, 상태 확인(Health Check)을 통해 비정상 인스턴스로는 트래픽을 보내지 않습니다.",
            hint: "트래픽의 부하를 균형(Balancing) 있게 나눠줍니다."
        },
        {
            q: "웹 애플리케이션을 AWS Elastic Beanstalk를 사용하여 배포하려고 합니다. Elastic Beanstalk가 자동으로 처리해 주지 않는 작업은 무엇입니까?",
            options: ["애플리케이션 코드 작성 및 최적화", "용량 프로비저닝", "로드 밸런싱 및 오토 스케일링", "애플리케이션 상태 모니터링"],
            answer: 0,
            rationale: "Elastic Beanstalk는 인프라 배포 및 관리를 자동화해 주는 PaaS이지만, 실제 애플리케이션 '코드'를 작성하는 것은 개발자의 책임입니다.",
            hint: "AWS가 코드를 대신 짜주지는 않습니다."
        },
        
        // --- Networking (심화) ---
        {
            q: "프라이빗 서브넷(Private Subnet)에 있는 EC2 인스턴스가 인터넷에서 소프트웨어 패치를 다운로드해야 하지만, 외부 인터넷에서 해당 인스턴스로 직접 접속하는 것은 차단해야 합니다. 무엇을 사용해야 합니까?",
            options: ["NAT Gateway", "Internet Gateway", "Egress-Only Internet Gateway (IPv6용)", "VPC Peering"],
            answer: 0,
            rationale: "NAT Gateway는 프라이빗 서브넷의 인스턴스가 인터넷(외부)으로 나가는 통신은 허용하지만, 외부에서 안으로 들어오는 연결은 시작할 수 없게 합니다.",
            hint: "나가는 건 되지만 들어오는 건 안 되는 게이트웨이입니다."
        },
        {
            q: "회사의 온프레미스 데이터 센터와 AWS VPC 간에 전용 사설 네트워크 연결을 구축하여 일관된 네트워크 성능과 보안을 확보하고자 합니다. 인터넷을 통하지 않는 이 서비스는?",
            options: ["AWS Direct Connect", "AWS Site-to-Site VPN", "VPC Peering", "AWS Transit Gateway"],
            answer: 0,
            rationale: "Direct Connect는 인터넷을 우회하여 온프레미스와 AWS를 물리적으로 연결하는 전용 회선 서비스입니다.",
            hint: "인터넷 없이 '직접(Direct)' 연결합니다."
        },
        {
            q: "VPC 보안 그룹(Security Group)과 네트워크 ACL(NACL)의 주요 차이점 중 올바른 설명은 무엇입니까?",
            options: ["보안 그룹은 상태 저장(Stateful)이고, NACL은 상태 비저장(Stateless)이다.", "보안 그룹은 서브넷 수준에서 작동하고, NACL은 인스턴스 수준에서 작동한다.", "보안 그룹은 거부(Deny) 규칙을 지원하지만, NACL은 지원하지 않는다.", "보안 그룹은 모든 트래픽을 기본적으로 허용하고, NACL은 기본적으로 차단한다."],
            answer: 0,
            rationale: "보안 그룹은 요청 트래픽이 허용되면 응답 트래픽도 자동으로 허용(Stateful)되지만, NACL은 인바운드/아웃바운드를 각각 명시적으로 허용해야 합니다(Stateless).",
            hint: "상태(State)를 기억하는지 여부가 가장 큰 차이입니다."
        },
        {
            q: "전 세계 사용자에게 정적 콘텐츠를 제공하는 웹 사이트의 로딩 속도를 개선하기 위해 사용자와 가장 가까운 엣지 로케이션을 활용하는 서비스는?",
            options: ["Amazon CloudFront", "AWS Global Accelerator", "Amazon Route 53", "Amazon S3 Transfer Acceleration"],
            answer: 0,
            rationale: "CloudFront는 CDN 서비스로, 전 세계 엣지 로케이션에 콘텐츠를 캐싱하여 지연 시간을 줄입니다.",
            hint: "콘텐츠 전송 네트워크(CDN)입니다."
        },
        {
            q: "서로 다른 두 개의 VPC가 마치 같은 네트워크에 있는 것처럼 프라이빗 IP 주소를 사용하여 통신하도록 설정하는 기능은?",
            options: ["VPC Peering", "AWS Direct Connect", "VPN Gateway", "VPC Endpoint"],
            answer: 0,
            rationale: "VPC Peering 연결은 두 VPC 간의 비공개 트래픽 라우팅을 가능하게 하는 1:1 네트워크 연결입니다.",
            hint: "두 친구(Peer)를 연결해줍니다."
        },
        {
            q: "수천 개의 VPC와 온프레미스 네트워크를 단일 허브로 연결하여 네트워크 토폴로지를 단순화하고 중앙에서 관리할 수 있게 해주는 서비스는?",
            options: ["AWS Transit Gateway", "VPC Peering", "AWS Direct Connect Gateway", "Elastic Load Balancing"],
            answer: 0,
            rationale: "Transit Gateway는 중앙 허브 역할을 하여 복잡한 피어링 연결망을 대체하고 네트워크 관리를 간소화합니다.",
            hint: "교통 환승 센터(Transit)와 같은 역할을 합니다."
        },

        // --- Security (심화) ---
        {
            q: "웹 애플리케이션을 SQL 인젝션(SQL Injection) 및 크로스 사이트 스크립팅(XSS)과 같은 일반적인 웹 공격으로부터 보호해야 합니다. 어떤 서비스를 사용해야 합니까?",
            options: ["AWS WAF (Web Application Firewall)", "AWS Shield", "Amazon Inspector", "Security Groups"],
            answer: 0,
            rationale: "AWS WAF는 애플리케이션 계층(Layer 7)에서 동작하며, 웹 공격 패턴을 정의하여 트래픽을 차단할 수 있습니다.",
            hint: "웹(Web) 애플리케이션을 위한 방화벽입니다."
        },
        {
            q: "AWS 계정 내에서 비정상적인 API 호출이나 잠재적인 무단 액세스와 같은 악의적 활동을 지속적으로 모니터링하고 탐지하는 지능형 위협 탐지 서비스는?",

        {

            rationale: "서비스 할당량(Quota) 또는 한도(Limit)를 모니터링하여 용량 부족 문제를 예방합니다.",

    // 변수 초기화
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let userAnswers = [];

    // 셔플 알고리즘 (Fisher-Yates)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // 문제 데이터 섞기 (보기 순서도 함께 섞음)
    function prepareQuestions() {
        // 1. 전체 문제 복사
        let shuffled = JSON.parse(JSON.stringify(rawQuestions));
        
        // 2. 문제 순서 섞기
        shuffleArray(shuffled);
        
        // 3. 각 문제의 보기(Options) 섞기 및 정답 인덱스 재조정
        shuffled.forEach(q => {
            const correctAnswerText = q.options[q.answer]; // 원래 정답 텍스트 저장
            shuffleArray(q.options); // 보기 섞기
            q.answer = q.options.indexOf(correctAnswerText); // 섞인 배열에서 정답 위치 찾기
        });
        
        return shuffled;
    }

    // 퀴즈 시작
    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        // 데이터 준비
        currentQuestions = prepareQuestions();
        
        // 상태 초기화
        currentQuestionIndex = 0;
        userAnswers = new Array(currentQuestions.length).fill(null);
        
        loadQuestion();
    }

    // 문제 로드 및 렌더링
    function loadQuestion() {
        const qData = currentQuestions[currentQuestionIndex];
        
        // UI 업데이트
        document.getElementById('q-number').innerText = currentQuestionIndex + 1;
        document.getElementById('q-text').innerText = qData.q;
        
        // 힌트 초기화
        document.getElementById('q-hint').style.display = 'none';
        document.getElementById('q-hint').innerText = qData.hint;
        
        // 프로그레스 바
        const progressPercent = ((currentQuestionIndex) / currentQuestions.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';

        // 옵션 영역 초기화
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = ''; 

        // 옵션 생성
        qData.options.forEach((optText, idx) => {
            const label = document.createElement('label');
            label.className = 'option-label';
            
            // 라디오 버튼 생성
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'option';
            radio.value = idx;
            
            // 선택 상태 복원
            if (userAnswers[currentQuestionIndex] === idx) {
                radio.checked = true;
                label.classList.add('selected');
            }

            // 클릭 이벤트
            label.onclick = (e) => {
                // 라디오 버튼 클릭 중복 방지
                if(e.target !== radio) radio.checked = true;
                selectOption(idx);
                
                // 스타일 업데이트
                document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
                label.classList.add('selected');
            };
            
            label.appendChild(radio);
            label.appendChild(document.createTextNode(optText));
            optionsArea.appendChild(label);
        });

        // 버튼 상태 관리
        document.getElementById('prev-btn').disabled = (currentQuestionIndex === 0);
        document.getElementById('next-btn').innerText = (currentQuestionIndex === currentQuestions.length - 1) ? '제출 및 결과 보기 (Finish)' : '다음 (Next)';
    }

    // 정답 저장
    function selectOption(idx) {
        userAnswers[currentQuestionIndex] = idx;
    }

    // 힌트 토글
    function toggleHint() {
        const hintEl = document.getElementById('q-hint');
        hintEl.style.display = (hintEl.style.display === 'none') ? 'block' : 'none';
    }

    // 이전 문제
    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    }

    // 다음 문제
    function nextQuestion() {
        if (userAnswers[currentQuestionIndex] === null) {
            if(!confirm("답을 선택하지 않았습니다. 정말 넘어가시겠습니까?")) return;
        }

        if (currentQuestionIndex < currentQuestions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    // 퀴즈 종료 및 결과
    function finishQuiz() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let score = 0;
        currentQuestions.forEach((q, idx) => {
            if (userAnswers[idx] === q.answer) {
                score++;
            }
        });

        // 점수 계산 (문제당 2점)
        const finalScore = score * 2;
        document.getElementById('score').innerText = finalScore;

        const statusEl = document.getElementById('pass-status');
        const detailEl = document.getElementById('score-detail');

        if (finalScore >= 70) {
            statusEl.innerText = "🎉 합격 (PASS)";
            statusEl.className = "pass-status pass";
            detailEl.innerText = `총 50문제 중 ${score}개를 맞추셨습니다. 완벽합니다!`;
        } else {
            statusEl.innerText = "⚠️ 불합격 (FAIL)";
            statusEl.className = "pass-status fail";
            detailEl.innerText = `총 50문제 중 ${score}개를 맞추셨습니다. 35개(70점) 이상이어야 합격입니다.`;
        }
    }

    // 재시작
    function restartQuiz() {
        if(confirm("시험을 처음부터 다시 시작하시겠습니까?\n모든 문제와 보기가 새롭게 섞입니다.")) {
            startQuiz();
        }
    }

    // 오답 노트 생성
    function showReview() {
        const reviewArea = document.getElementById('review-area');
        reviewArea.style.display = 'block';
        reviewArea.innerHTML = '<h3 style="border-bottom:2px solid #ddd; padding-bottom:10px;">❌ 오답 노트 & 해설</h3>';

        let wrongCount = 0;

        currentQuestions.forEach((q, idx) => {
            const userChoice = userAnswers[idx];
            // 틀렸거나 안 푼 문제 표시
            if (userChoice !== q.answer) {
                wrongCount++;
                const item = document.createElement('div');
                item.className = 'review-item';
                
                const userText = (userChoice === null) ? "(미응답)" : q.options[userChoice];
                const correctText = q.options[q.answer];

                item.innerHTML = `
                    <div class="review-q-text">Q${idx+1}. ${q.q}</div>
                    <div class="review-ans-row">
                        나의 선택: <span class="review-my-ans">${userText}</span>
                    </div>
                    <div class="review-ans-row">
                        정답: <span class="review-correct-ans">${correctText}</span>
                    </div>
                    <div class="rationale">
                        <strong>💡 해설:</strong> ${q.rationale}
                    </div>
                `;
                reviewArea.appendChild(item);
            }
        });

        if (wrongCount === 0) {
            reviewArea.innerHTML += '<div style="text-align:center; padding:20px; color:green; font-weight:bold;">축하합니다! 틀린 문제가 하나도 없습니다. 💯</div>';
        }
    }
