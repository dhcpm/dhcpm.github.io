<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS CLF 실전 모의고사 (DONGGYUN님 전용 v2)</title>
    <style>
        :root {
            --aws-orange: #FF9900;
            --aws-blue: #232F3E;
            --light-gray: #EAEDED;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-gray);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--aws-blue);
            text-align: center;
            border-bottom: 2px solid var(--aws-orange);
            padding-bottom: 10px;
        }
        .btn {
            background-color: var(--aws-orange);
            color: var(--aws-blue);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 5px;
        }
        .btn:hover {
            background-color: #ffac31;
        }
        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--aws-blue);
            color: var(--aws-blue);
        }
        .btn-outline:hover {
            background-color: var(--light-gray);
        }
        /* Quiz Section */
        .question-box {
            display: none;
        }
        .question-text {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            background-color: #f9f9f9;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }
        .option-label:hover {
            background-color: #f0f0f0;
            border-color: var(--aws-orange);
        }
        .option-label input {
            margin-right: 15px;
            transform: scale(1.2);
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        .progress-bar {
            width: 100%;
            background-color: #ddd;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: var(--aws-blue);
            width: 0%;
            transition: width 0.3s;
        }
        /* Result Section */
        .result-box {
            display: none;
            text-align: center;
        }
        .score-display {
            font-size: 2em;
            margin: 20px 0;
            color: var(--aws-blue);
        }
        .pass-status {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .pass { color: green; }
        .fail { color: red; }
        
        .review-box {
            display: none;
            text-align: left;
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
            border-top: 1px solid #ccc;
        }
        .review-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .review-correct { color: green; font-weight: bold; }
        .review-wrong { color: red; font-weight: bold; }
        .rationale {
            background-color: #e8f4f8;
            padding: 10px;
            border-radius: 5px;
            margin-top: 5px;
            font-size: 0.9em;
        }
        .hint-btn {
            background: none;
            border: none;
            color: #0073bb;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .hint-text {
            display: none;
            color: #555;
            font-style: italic;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>AWS Cloud Practitioner 실전 모의고사</h1>
        <p style="text-align: center; font-size: 1.1em;">
            총 50문항 (랜덤 정렬) | 합격 기준 70점<br><br>
            <strong>개선 사항:</strong> 문제와 보기의 순서가 모두 랜덤으로 섞입니다.<br>
            DONGGYUN님, 준비되셨나요?
        </p>
        <div style="text-align: center;">
            <button class="btn" onclick="startQuiz()">시험 시작 (Start Quiz)</button>
        </div>
    </div>

    <div id="quiz-screen" class="question-box">
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div style="margin-bottom: 10px; color: #666;">
            문제 <span id="q-number">1</span> / 50
        </div>
        <div class="question-text" id="q-text">질문이 여기에 표시됩니다.</div>
        <div class="options-container" id="options-area">
            </div>
        <button class="hint-btn" onclick="toggleHint()">💡 힌트 보기</button>
        <div class="hint-text" id="q-hint"></div>

        <div class="controls">
            <button class="btn btn-outline" id="prev-btn" onclick="prevQuestion()" disabled>이전</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()">다음</button>
        </div>
    </div>

    <div id="result-screen" class="result-box">
        <h1>시험 결과</h1>
        <div class="score-display">
            점수: <span id="score">0</span> / 100
        </div>
        <div class="pass-status" id="pass-status"></div>
        <p id="score-detail"></p>
        
        <div>
            <button class="btn" onclick="restartQuiz()">🔄 처음부터 다시 풀기 (Restart)</button>
            <button class="btn btn-outline" onclick="showReview()">❌ 오답 노트 확인 (Review)</button>
        </div>

        <div id="review-area" class="review-box">
            </div>
    </div>
</div>

<script>
    // 50문항 원본 데이터 (정답은 일단 0번 인덱스로 고정되어 있으나, 실행 시 섞임)
    const rawQuestions = [
        {
            q: "AWS 공동 책임 모델(Shared Responsibility Model)에 따르면, 고객이 책임져야 하는 '클라우드 내부의 보안(Security IN the Cloud)' 항목은 무엇입니까?",
            options: ["IAM 계정 및 암호 관리", "데이터 센터의 물리적 보안", "하드웨어 폐기", "엣지 로케이션 인프라 관리"],
            answer: 0,
            rationale: "AWS는 인프라를 보호하지만, 그 위에서 생성하는 사용자 계정과 비밀번호를 안전하게 관리하는 것은 고객의 책임입니다.",
            hint: "사용자가 콘솔에서 직접 설정하거나 변경할 수 있는 것이 무엇인지 생각해보세요."
        },
        {
            q: "전 세계 사용자에게 정적 및 동적 웹 콘텐츠를 더 빠르게 전송하기 위해 엣지 로케이션(Edge Location)을 사용하는 AWS 서비스는 무엇입니까?",
            options: ["Amazon CloudFront", "Amazon Route 53", "AWS Global Accelerator", "Amazon S3"],

            options: ["Amazon RDS", "Amazon DynamoDB", "Amazon Redshift", "Amazon EC2"],

        {

    // 변수 초기화
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let userAnswers = [];

    // 셔플 알고리즘 (Fisher-Yates)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // 보기(Options) 섞기 알고리즘
    function createShuffledQuestion(originalQ) {
        // 객체 복사 (원본 보존)
        let q = JSON.parse(JSON.stringify(originalQ));
        
        // 정답 텍스트 저장
        const correctAnswerText = q.options[q.answer];
        
        // 보기 섞기
        shuffleArray(q.options);
        
        // 정답 인덱스 재설정 (섞인 보기 중에서 정답 텍스트의 위치 찾기)
        q.answer = q.options.indexOf(correctAnswerText);
        
        return q;
    }

    // 퀴즈 시작 (처음 시작 or 재시작)
    function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        // 1. 문제 순서 섞기
        let shuffledRaw = [...rawQuestions]; // 복사
        shuffleArray(shuffledRaw);
        
        // 2. 각 문제의 보기(Options) 섞기
        currentQuestions = shuffledRaw.map(q => createShuffledQuestion(q));
        
        // 변수 초기화
        currentQuestionIndex = 0;
        userAnswers = new Array(currentQuestions.length).fill(null);
        
        loadQuestion();
    }

    // 문제 로드
    function loadQuestion() {
        const qData = currentQuestions[currentQuestionIndex];
        
        // UI 업데이트
        document.getElementById('q-number').innerText = currentQuestionIndex + 1;
        document.getElementById('q-text').innerText = qData.q;
        document.getElementById('q-hint').style.display = 'none';
        document.getElementById('q-hint').innerText = qData.hint;
        
        // 프로그레스 바
        const progressPercent = ((currentQuestionIndex) / currentQuestions.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';

        // 옵션 생성
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = ''; // 기존 옵션 지우기

        qData.options.forEach((optText, idx) => {
            const label = document.createElement('label');
            label.className = 'option-label';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'option';
            radio.value = idx;
            
            // 이전에 선택한 답이 있으면 체크 표시
            if (userAnswers[currentQuestionIndex] === idx) {
                radio.checked = true;
                label.style.borderColor = 'var(--aws-orange)';
                label.style.backgroundColor = '#f0f0f0';
            }

            radio.onchange = () => selectOption(idx);
            
            label.appendChild(radio);
            label.appendChild(document.createTextNode(optText));
            optionsArea.appendChild(label);
        });

        // 버튼 상태
        document.getElementById('prev-btn').disabled = (currentQuestionIndex === 0);
        document.getElementById('next-btn').innerText = (currentQuestionIndex === currentQuestions.length - 1) ? '제출 및 결과 보기' : '다음';
    }

    // 옵션 선택 시 저장
    function selectOption(idx) {
        userAnswers[currentQuestionIndex] = idx;
    }

    // 힌트 토글
    function toggleHint() {
        const hintEl = document.getElementById('q-hint');
        hintEl.style.display = (hintEl.style.display === 'none') ? 'block' : 'none';
    }

    // 이전/다음 버튼 로직
    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < currentQuestions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    // 퀴즈 종료 및 결과 산출
    function finishQuiz() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let score = 0;
        currentQuestions.forEach((q, idx) => {
            if (userAnswers[idx] === q.answer) {
                score++;
            }
        });

        // 100점 만점으로 환산 (문제당 2점)
        const finalScore = score * 2;
        document.getElementById('score').innerText = finalScore;

        const statusEl = document.getElementById('pass-status');
        const detailEl = document.getElementById('score-detail');

        if (finalScore >= 70) {
            statusEl.innerText = "🎉 합격 (PASS)";
            statusEl.className = "pass-status pass";
            detailEl.innerText = "축하합니다! DONGGYUN님, 합격권입니다.";
        } else {
            statusEl.innerText = "⚠️ 불합격 (FAIL)";
            statusEl.className = "pass-status fail";
            detailEl.innerText = "조금 더 분발하세요! 오답 노트를 확인해 보세요.";
        }
    }

    // 재시작 함수
    function restartQuiz() {
        if(confirm("시험을 처음부터 다시 시작하시겠습니까? 문제 순서와 보기가 모두 섞입니다.")) {
            startQuiz();
        }
    }

    // 오답 노트 보기
    function showReview() {
        const reviewArea = document.getElementById('review-area');
        reviewArea.style.display = 'block';
        reviewArea.innerHTML = '<h2>❌ 오답 노트</h2>';

        let wrongCount = 0;

        currentQuestions.forEach((q, idx) => {
            const userChoice = userAnswers[idx];
            if (userChoice !== q.answer) {
                wrongCount++;
                const item = document.createElement('div');
                item.className = 'review-item';
                
                const userText = (userChoice === null) ? "(미응답)" : q.options[userChoice];
                const correctText = q.options[q.answer];

                item.innerHTML = `
                    <div style="font-weight:bold; color:#333;">Q${idx+1}. ${q.q}</div>
                    <div style="margin: 10px 0;">
                        <span class="review-wrong">내 답: ${userText}</span> <br>
                        <span class="review-correct">정답: ${correctText}</span>
                    </div>
                    <div class="rationale">💡 <strong>해설:</strong> ${q.rationale}</div>
                `;
                reviewArea.appendChild(item);
            }
        });

        if (wrongCount === 0) {
            reviewArea.innerHTML += '<p style="text-align:center; color:green;">틀린 문제가 없습니다. 완벽합니다! 👍</p>';
        }
    }

</script>
