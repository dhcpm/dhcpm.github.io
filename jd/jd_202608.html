        // 학년도 추출 유틸리티 (3월 1일 ~ 다음해 2월 말일 기준)
        function getAcademicYear(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('.');
            if (parts.length < 3) return null;
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10);
            if (isNaN(year) || isNaN(month)) return null;
            return (month === 1 || month === 2) ? year - 1 : year;
        }

        // 초기 데이터 로드 및 드롭다운 메뉴 세팅
        function handleDataLoad(data) {
            if (!data || data.length === 0) return;
            globalRawData = data; // 원본 데이터 저장

            // 학과 추출 및 중복 제거
            const depts = new Set();
            data.forEach(row => {
                if (row['학과'] && row['학과'].trim() !== '') {
                    depts.add(row['학과'].trim());
                }
            });

            // 드롭다운 메뉴 업데이트
            const deptSelect = document.getElementById('deptFilter');
            if (deptSelect) {
                const currentSelection = deptSelect.value;
                
                deptSelect.innerHTML = '<option value="all">전체 학과</option>';
                Array.from(depts).sort().forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept;
                    option.textContent = dept;
                    deptSelect.appendChild(option);
                });

                // 기존 선택값이 새 데이터에도 있으면 유지, 없으면 전체로 초기화
                if (depts.has(currentSelection)) {
                    deptSelect.value = currentSelection;
                } else {
                    deptSelect.value = 'all';
                }
            }

            processFilteredData();
        }

        // 선택된 필터에 따라 데이터 분류
        function processFilteredData() {
            const filterEl = document.getElementById('deptFilter');
            const selectedDept = filterEl ? filterEl.value : 'all';
            
            const filteredData = selectedDept === 'all' 
                ? globalRawData 
                : globalRawData.filter(row => row['학과'] && row['학과'].trim() === selectedDept);
            
            processData(filteredData, selectedDept);
        }

        // 데이터 프로세싱
        function processData(data, selectedDept = 'all') {
            // 데이터가 없어도 UI/차트가 정상 초기화되도록 허용
            if (!data) data = [];

            const today = new Date();
            const currentRealYear = today.getFullYear();
            const currentRealMonth = today.getMonth() + 1; // 1 ~ 12
            
            // 1, 2월인 경우 전년도가 현재 학년도가 됨
            let yearCurr = (currentRealMonth === 1 || currentRealMonth === 2) ? currentRealYear - 1 : currentRealYear;
            let yearPrev = yearCurr - 1;
            let yearPrevPrev = yearPrev - 1;

            // 1. 최근학년도의 최신 월(최근월) 먼저 찾기
            let latestMonthIndex = -1;
            let latestMonth = currentRealMonth; // 기본값
            data.forEach(row => {
                const academicYear = getAcademicYear(row['제적일자']);
                if (academicYear === yearCurr) {
                    const dateParts = row['제적일자'].split('.');
                    if(dateParts.length >= 2) {
                        const month = parseInt(dateParts[1], 10);
                        const mIdx = academicMonths.indexOf(month);
                        if (mIdx > latestMonthIndex) {
                            latestMonthIndex = mIdx;
                            latestMonth = month;
                        }
                    }
                }
            });

            let countPrevPrev = 0; let countPrev = 0; let countCurr = 0;
            let monthlyDataPrev = Array(12).fill(0); let monthlyDataCurr = Array(12).fill(0);
            let deptsMapPrev = {}; let deptsMapCurr = {};
            let volReasonsMapCurr = {};
            let gradesDetailCurr = {}; // 특정 학년 딥다이브용
            let specificDropoutsMap = {}; // 학과부적응/적성불일치 상세 데이터용
            
            // 특정 월(최근월) 비교용 변수 추가
            let countPrev_Month = 0; let countCurr_Month = 0;
            let reasonsMapPrev_Month = {}; let reasonsMapCurr_Month = {};
            let gradesMapPrev_Month = {}; let gradesMapCurr_Month = {};
            let gradesMapCurr_Total = {};

            data.forEach(row => {
                const academicYear = getAcademicYear(row['제적일자']);
                if (!academicYear) return;

                if (academicYear === yearPrevPrev) {
                    countPrevPrev++;
                    return; // 차트에 반영하지 않고 남은 비율용 카운트만 실행
                }
                if (academicYear !== yearPrev && academicYear !== yearCurr) return;

                const dateParts = row['제적일자'].split('.');
                const month = parseInt(dateParts[1], 10);
                const monthIndex = academicMonths.indexOf(month);
                
                const reason = row['제적구분'] ? row['제적구분'].trim() : '기타/미상';
                const dept = row['학과'] ? row['학과'].trim() : '소속불명';
                const grade = row['학년'] ? row['학년'].trim() + '학년' : '미기재';

                if (academicYear === yearPrev) {
                    countPrev++;
                    if(monthIndex !== -1) monthlyDataPrev[monthIndex]++;
                    deptsMapPrev[dept] = (deptsMapPrev[dept] || 0) + 1;
                    
                    // 최근월 단일 비교용 데이터 적재
                    if (month === latestMonth) {
                        countPrev_Month++;
                        reasonsMapPrev_Month[reason] = (reasonsMapPrev_Month[reason] || 0) + 1;
                        gradesMapPrev_Month[grade] = (gradesMapPrev_Month[grade] || 0) + 1;
                    }
                } else if (academicYear === yearCurr) {
                    countCurr++;
                    if(monthIndex !== -1) monthlyDataCurr[monthIndex]++;
                    deptsMapCurr[dept] = (deptsMapCurr[dept] || 0) + 1;
                    gradesMapCurr_Total[grade] = (gradesMapCurr_Total[grade] || 0) + 1;
                    
                    if (!gradesDetailCurr[grade]) gradesDetailCurr[grade] = { total: 0, reasons: {}, volReasons: {} };
                    gradesDetailCurr[grade].total++;
                    gradesDetailCurr[grade].reasons[reason] = (gradesDetailCurr[grade].reasons[reason] || 0) + 1;

                    if (reason === '자퇴') {
                        const volReasonDetail = (row['비고'] && row['비고'].trim() !== '') ? row['비고'].trim() : '기타/미기재';
                        volReasonsMapCurr[volReasonDetail] = (volReasonsMapCurr[volReasonDetail] || 0) + 1;
                        gradesDetailCurr[grade].volReasons[volReasonDetail] = (gradesDetailCurr[grade].volReasons[volReasonDetail] || 0) + 1;
                        
                        // 학과부적응 또는 적성불일치 데이터 집계
                        if (volReasonDetail.includes('학과부적응') || volReasonDetail.includes('적성불일치')) {
                            const key = `${dept}|${grade}|${volReasonDetail}`;
                            specificDropoutsMap[key] = (specificDropoutsMap[key] || 0) + 1;
                        }
                    }

                    // 최근월 단일 비교용 데이터 적재
                    if (month === latestMonth) {
                        countCurr_Month++;
                        reasonsMapCurr_Month[reason] = (reasonsMapCurr_Month[reason] || 0) + 1;
                        gradesMapCurr_Month[grade] = (gradesMapCurr_Month[grade] || 0) + 1;
                    }
                }
            });

            // 최다 탈락 학년 찾기
            let topGrade = null;
            let maxCount = 0;
            for (const [g, details] of Object.entries(gradesDetailCurr)) {
                if (details.total > maxCount) {
                    maxCount = details.total;
                    topGrade = g;
                }
            }

            // UI 텍스트 안전 업데이트 (null 에러 방지)
            setText('headerSubtitle', `기준: ${yearPrev}학년도 및 ${yearCurr}학년도 비교 분석`);
            setText('cardYearPrevText', `${yearPrev}학년도 합계`);
            setText('cardDatePrevText', `(${yearPrev}.03.01 ~ ${yearPrev+1}.02.말일)`);
            setText('cardYearCurrText', `${yearCurr}학년도 합계`);
            setText('cardDateCurrText', `(${yearCurr}.03.01 ~ ${yearCurr+1}.02.말일)`);
            setText('legendPrevText', `${yearPrev}학년도`);
            setText('legendCurrText', `${yearCurr}학년도`);
            setText('volReasonTitle', `${yearCurr}학년도 자퇴사유`);
            setText('gradeCountTitleYear', `(${yearCurr}학년도 전체)`);
            setText('reasonTitleMonth', `(${latestMonth}월 비교)`);
            setText('gradeTitleMonth', `(${latestMonth}월 비교)`);
            setText('deptChartMainTitle', selectedDept === 'all' ? '전체 학과별 중도탈락 현황 비교' : `${selectedDept} 중도탈락 현황 비교`);
            setText('deptChartTitle', `(${yearPrev} vs ${yearCurr})`);

            setHTML('valPrev', `${countPrev.toLocaleString()}<span class="text-base font-normal text-gray-400 ml-1">명</span>`);
            setHTML('valCurr', `${countCurr.toLocaleString()}<span class="text-base font-normal text-gray-400 ml-1">명</span>`);

            // 전년 대비 남은 비율 계산 및 UI 업데이트
            const remainPrevEl = document.getElementById('remainPrev');
            if (remainPrevEl) {
                remainPrevEl.title = `전전년도(${String(yearPrevPrev).slice(-2)}년) 최종 탈락자 수 도달까지 남은 비율`;
                if (countPrevPrev > 0) {
                    const remainPrev = ((countPrevPrev - countPrev) / countPrevPrev) * 100;
                    remainPrevEl.innerHTML = remainPrev >= 0 
                        ? `전년 대비 <span class="text-sm font-bold ml-0.5">${remainPrev.toFixed(1)}%</span> 남음`
                        : `전년 대비 <span class="text-sm font-bold ml-0.5">${Math.abs(remainPrev).toFixed(1)}%</span> 초과`;
                    remainPrevEl.className = remainPrev >= 0 
                        ? "mb-1 text-xs font-medium px-2 py-1 rounded bg-[#D98E04]/20 text-[#BF6B04]" 
                        : "mb-1 text-xs font-medium px-2 py-1 rounded bg-red-100 text-red-600";
                } else {
                    remainPrevEl.innerHTML = `${String(yearPrevPrev).slice(-2)}년도 데이터 없음`;
                    remainPrevEl.className = "mb-1 text-xs font-medium px-2 py-1 rounded bg-gray-100 text-gray-500";
                }
            }

            const remainCurrEl = document.getElementById('remainCurr');
            if (remainCurrEl) {
                remainCurrEl.title = `전년도(${String(yearPrev).slice(-2)}년) 최종 탈락자 수 도달까지 남은 비율`;
                if (countPrev > 0) {
                    const remainCurr = ((countPrev - countCurr) / countPrev) * 100;
                    remainCurrEl.innerHTML = remainCurr >= 0 
                        ? `전년 대비 <span class="text-sm font-bold ml-0.5">${remainCurr.toFixed(1)}%</span> 남음`
                        : `전년 대비 <span class="text-sm font-bold ml-0.5">${Math.abs(remainCurr).toFixed(1)}%</span> 초과`;
                    remainCurrEl.className = remainCurr >= 0 
                        ? "mb-1 text-xs font-medium px-2 py-1 rounded bg-[#465902]/20 text-[#1B260B]" 
                        : "mb-1 text-xs font-medium px-2 py-1 rounded bg-red-100 text-red-600";
                } else {
                    remainCurrEl.innerHTML = `${String(yearPrev).slice(-2)}년도 데이터 없음`;
                    remainCurrEl.className = "mb-1 text-xs font-medium px-2 py-1 rounded bg-gray-100 text-gray-500";
                }
            }

            updateCharts(yearPrev, yearCurr, latestMonth, monthlyDataPrev, monthlyDataCurr, reasonsMapPrev_Month, reasonsMapCurr_Month, countPrev_Month, countCurr_Month, gradesMapPrev_Month, gradesMapCurr_Month, gradesMapCurr_Total, countPrev, countCurr, deptsMapPrev, deptsMapCurr, volReasonsMapCurr, topGrade, gradesDetailCurr[topGrade], specificDropoutsMap);
        }

        function updateCharts(yearPrev, yearCurr, latestMonth, dataPrev, dataCurr, reasonsMapPrev_Month, reasonsMapCurr_Month, countPrev_Month, countCurr_Month, gradesMapPrev_Month, gradesMapCurr_Month, gradesMapCurr_Total, countPrev, countCurr, deptsMapPrev, deptsMapCurr, volReasonsMapCurr, topGrade, topGradeDetails, specificDropoutsMap) {
            // 차트 렌더링 안정성을 위해 옵셔널 체이닝(Optional Chaining) 적용
            
            if (monthlyChart?.data?.datasets) {
                if (monthlyChart.data.datasets[0]) monthlyChart.data.datasets[0].label = `${yearPrev}학년도`;
                if (monthlyChart.data.datasets[1]) monthlyChart.data.datasets[1].label = `${yearCurr}학년도`;
                if (monthlyChart.data.datasets[0]) monthlyChart.data.datasets[0].data = dataPrev;
                if (monthlyChart.data.datasets[1]) monthlyChart.data.datasets[1].data = dataCurr;
                monthlyChart.update();
            }

            if (reasonChart?.data?.datasets) {
                if (reasonChart.data.datasets[0]) reasonChart.data.datasets[0].label = `${yearPrev}년 ${latestMonth}월(%)`;
                if (reasonChart.data.datasets[1]) reasonChart.data.datasets[1].label = `${yearCurr}년 ${latestMonth}월(%)`;
                if (reasonChart.data.datasets[2]) reasonChart.data.datasets[2].label = `${yearPrev}년 ${latestMonth}월(명)`;
                if (reasonChart.data.datasets[3]) reasonChart.data.datasets[3].label = `${yearCurr}년 ${latestMonth}월(명)`;
                
                const allReasons = Array.from(new Set([...Object.keys(reasonsMapPrev_Month), ...Object.keys(reasonsMapCurr_Month)]));
                reasonChart.data.labels = allReasons.length > 0 ? allReasons : ['데이터 없음'];
                
                if (reasonChart.data.datasets[0]) reasonChart.data.datasets[0].data = allReasons.map(r => countPrev_Month > 0 ? ((reasonsMapPrev_Month[r] || 0) / countPrev_Month * 100) : 0);
                if (reasonChart.data.datasets[1]) reasonChart.data.datasets[1].data = allReasons.map(r => countCurr_Month > 0 ? ((reasonsMapCurr_Month[r] || 0) / countCurr_Month * 100) : 0);
                if (reasonChart.data.datasets[2]) reasonChart.data.datasets[2].data = allReasons.map(r => reasonsMapPrev_Month[r] || 0);
                if (reasonChart.data.datasets[3]) reasonChart.data.datasets[3].data = allReasons.map(r => reasonsMapCurr_Month[r] || 0);
                reasonChart.update();
            }

            if (gradeCountChart?.data?.datasets) {
                const allGrades = Array.from(new Set([...Object.keys(gradesMapPrev_Month), ...Object.keys(gradesMapCurr_Month), ...Object.keys(gradesMapCurr_Total)])).sort();
                if (gradeCountChart.data.datasets[0]) gradeCountChart.data.datasets[0].label = `${yearCurr}학년도 전체(명)`;
                gradeCountChart.data.labels = allGrades.length > 0 ? allGrades : ['데이터 없음'];
                if (gradeCountChart.data.datasets[0]) gradeCountChart.data.datasets[0].data = allGrades.map(g => gradesMapCurr_Total[g] || 0);
                gradeCountChart.update();
            }

            if (gradeChart?.data?.datasets) {
                const allGrades = Array.from(new Set([...Object.keys(gradesMapPrev_Month), ...Object.keys(gradesMapCurr_Month), ...Object.keys(gradesMapCurr_Total)])).sort();
                
                if (gradeChart.data.datasets[0]) gradeChart.data.datasets[0].label = `${yearPrev}년 ${latestMonth}월(%)`;
                if (gradeChart.data.datasets[1]) gradeChart.data.datasets[1].label = `${yearCurr}년 ${latestMonth}월(%)`;
                if (gradeChart.data.datasets[2]) gradeChart.data.datasets[2].label = `${yearPrev}년 ${latestMonth}월(명)`;
                if (gradeChart.data.datasets[3]) gradeChart.data.datasets[3].label = `${yearCurr}년 ${latestMonth}월(명)`;
                
                gradeChart.data.labels = allGrades.length > 0 ? allGrades : ['데이터 없음'];
                
                if (gradeChart.data.datasets[0]) gradeChart.data.datasets[0].data = allGrades.map(g => countPrev_Month > 0 ? ((gradesMapPrev_Month[g] || 0) / countPrev_Month * 100) : 0);
                if (gradeChart.data.datasets[1]) gradeChart.data.datasets[1].data = allGrades.map(g => countCurr_Month > 0 ? ((gradesMapCurr_Month[g] || 0) / countCurr_Month * 100) : 0);
                if (gradeChart.data.datasets[2]) gradeChart.data.datasets[2].data = allGrades.map(g => gradesMapPrev_Month[g] || 0);
                if (gradeChart.data.datasets[3]) gradeChart.data.datasets[3].data = allGrades.map(g => gradesMapCurr_Month[g] || 0);
                gradeChart.update();
            }

            if (volReasonChart?.data?.datasets) {
                const sortedVolReasons = Object.entries(volReasonsMapCurr).sort((a, b) => b[1] - a[1]);
                if(sortedVolReasons.length > 0) {
                    volReasonChart.data.labels = sortedVolReasons.map(item => item[0]);
                    if (volReasonChart.data.datasets[0]) volReasonChart.data.datasets[0].data = sortedVolReasons.map(item => item[1]);
                } else {
                    volReasonChart.data.labels = ['자퇴생 없음'];
                    if (volReasonChart.data.datasets[0]) volReasonChart.data.datasets[0].data = [0];
                }
                volReasonChart.update();
            }

            if (deptChart?.data?.datasets) {
                if (deptChart.data.datasets[0]) deptChart.data.datasets[0].label = `${yearPrev}학년도 (명)`;
                if (deptChart.data.datasets[1]) deptChart.data.datasets[1].label = `${yearCurr}학년도 (명)`;
                const allDepts = Array.from(new Set([...Object.keys(deptsMapPrev), ...Object.keys(deptsMapCurr)]));
                allDepts.sort((a, b) => ((deptsMapCurr[b] || 0) + (deptsMapPrev[b] || 0)) - ((deptsMapCurr[a] || 0) + (deptsMapPrev[a] || 0)));
                const minHeightPerItem = 45;
                const containerEl = document.getElementById('deptChartContainer');
                if (containerEl) containerEl.style.height = Math.max(500, allDepts.length * minHeightPerItem + 50) + 'px';
                if(allDepts.length > 0) {
                    deptChart.data.labels = allDepts;
                    if (deptChart.data.datasets[0]) deptChart.data.datasets[0].data = allDepts.map(d => deptsMapPrev[d] || 0);
                    if (deptChart.data.datasets[1]) deptChart.data.datasets[1].data = allDepts.map(d => deptsMapCurr[d] || 0);
                } else {
                    deptChart.data.labels = ['해당 데이터 없음'];
                    if (deptChart.data.datasets[0]) deptChart.data.datasets[0].data = [0];
                    if (deptChart.data.datasets[1]) deptChart.data.datasets[1].data = [0];
                }
                deptChart.update();
            }

            const topGradeSectionEl = document.getElementById('topGradeSection');
            if (topGrade && topGradeDetails) {
                setText('topGradeReasonTitle', `${yearCurr}학년도 최다 탈락 학년(${topGrade}) 제적구분`);
                setText('topGradeVolReasonTitle', `${yearCurr}학년도 ${topGrade} 자퇴사유`);

                if (topGradeReasonChart?.data?.datasets) {
                    const tgReasons = Object.keys(topGradeDetails.reasons);
                    topGradeReasonChart.data.labels = tgReasons.length > 0 ? tgReasons : ['데이터 없음'];
                    if (topGradeReasonChart.data.datasets[0]) topGradeReasonChart.data.datasets[0].data = tgReasons.length > 0 ? Object.values(topGradeDetails.reasons) : [0];
                    topGradeReasonChart.update();
                }

                if (topGradeVolReasonChart?.data?.datasets) {
                    const sortedTgVolReasons = Object.entries(topGradeDetails.volReasons).sort((a, b) => b[1] - a[1]);
                    if(sortedTgVolReasons.length > 0) {
                        topGradeVolReasonChart.data.labels = sortedTgVolReasons.map(item => item[0]);
                        if (topGradeVolReasonChart.data.datasets[0]) topGradeVolReasonChart.data.datasets[0].data = sortedTgVolReasons.map(item => item[1]);
                    } else {
                        topGradeVolReasonChart.data.labels = ['자퇴생 없음'];
                        if (topGradeVolReasonChart.data.datasets[0]) topGradeVolReasonChart.data.datasets[0].data = [0];
                    }
                    topGradeVolReasonChart.update();
                }
                if (topGradeSectionEl) topGradeSectionEl.style.display = '';
            } else {
                if (topGradeSectionEl) topGradeSectionEl.style.display = 'none';
            }

            // 학과부적응/적성불일치 상세 표 업데이트
            updateSpecificReasonTable(specificDropoutsMap, yearCurr);

            // 월별 증감률 표 업데이트
            updateMonthlyTable(yearPrev, yearCurr, dataPrev, dataCurr);
        }

        // 특정 자퇴사유(학과부적응/적성불일치) 표 생성 함수
        function updateSpecificReasonTable(dataMap, yearCurr) {
            setText('specificReasonTableTitleYear', `(${yearCurr}학년도)`);
            const tbody = document.getElementById('specificReasonTableBody');
            if (!tbody) return;
            
            const dataArray = Object.entries(dataMap).map(([key, count]) => {
                const [dept, grade, reason] = key.split('|');
                return { dept, grade, reason, count };
            });

            // 인원수 내림차순, 그 다음 학과명 오름차순 정렬
            dataArray.sort((a, b) => b.count - a.count || a.dept.localeCompare(b.dept));

            if (dataArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-gray-500">해당 사유로 자퇴한 학생 데이터가 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = dataArray.map(item => `
                <tr class="hover:bg-gray-50 border-b border-gray-200 last:border-0 transition-colors">
                    <td class="p-2.5 text-gray-700">${item.dept}</td>
                    <td class="p-2.5 text-gray-600">${item.grade}</td>
                    <td class="p-2.5 text-[#BF6B04] font-medium">${item.reason}</td>
                    <td class="p-2.5 font-bold text-[#465902]">${item.count}명</td>
                </tr>
            `).join('');
        }

        // 월별 증감률 표 생성 함수
        function updateMonthlyTable(yearPrev, yearCurr, dataPrev, dataCurr) {
            const container = document.getElementById('monthlyTableContainer');
            if (!container) return;
            
            const months = ['3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월', '1월', '2월'];
            
            let tableHTML = `
                <table class="w-full text-sm text-center border-collapse min-w-[700px]">
                    <thead>
                        <tr class="bg-[#D98E04]/10 text-gray-700">
                            <th class="border-b border-r border-gray-200 p-2.5 whitespace-nowrap font-bold bg-[#D98E04]/20 sticky left-0 z-10 shadow-[1px_0_0_0_#e5e7eb]">구분</th>
                            ${months.map(m => `<th class="border-b border-gray-200 p-2.5 font-bold">${m}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="border-b border-r border-gray-200 p-2 font-medium bg-white text-[#BF6B04] sticky left-0 z-10 shadow-[1px_0_0_0_#e5e7eb]">${yearPrev}학년도</td>
                            ${dataPrev.map(val => `<td class="border-b border-gray-200 p-2 text-gray-600">${val}</td>`).join('')}
                        </tr>
                        <tr>
                            <td class="border-b border-r border-gray-200 p-2 font-medium bg-white text-[#465902] sticky left-0 z-10 shadow-[1px_0_0_0_#e5e7eb]">${yearCurr}학년도</td>
                            ${dataCurr.map(val => `<td class="border-b border-gray-200 p-2 text-gray-600">${val}</td>`).join('')}
                        </tr>
                        <tr class="bg-gray-50/50">
                            <td class="border-r border-gray-200 p-2 font-bold text-gray-700 bg-gray-50 sticky left-0 z-10 shadow-[1px_0_0_0_#e5e7eb]">전년 대비</td>
                            ${dataPrev.map((valPrev, i) => {
                                const valCurr = dataCurr[i];
                                const diff = valCurr - valPrev;
                                let diffHTML = '-';
                                
                                // 비교 기준인 이전 학년도 값이 0이거나 최근 학년도 값이 0이면 전년 대비를 표시하지 않음
                                if (valPrev === 0 || valCurr === 0) {
                                    diffHTML = '<span class="text-gray-400">-</span>';
                                } else {
                                    const rate = (diff / valPrev) * 100;
                                    if (rate > 0) {
                                        diffHTML = `<div class="flex flex-col items-center leading-tight">
                                                        <span class="text-[#BF6B04] font-bold">▲ ${rate.toFixed(1)}%</span>
                                                        <span class="text-xs text-[#BF6B04]/70 mt-0.5">(+${diff}명)</span>
                                                    </div>`;
                                    } else if (rate < 0) {
                                        diffHTML = `<div class="flex flex-col items-center leading-tight">
                                                        <span class="text-[#465902] font-bold">▼ ${Math.abs(rate).toFixed(1)}%</span>
                                                        <span class="text-xs text-[#465902]/70 mt-0.5">(${diff}명)</span>
                                                    </div>`;
                                    } else {
                                        diffHTML = `<div class="flex flex-col items-center leading-tight">
                                                        <span class="text-gray-400 font-bold">-</span>
                                                        <span class="text-xs text-gray-400 mt-0.5">(0명)</span>
                                                    </div>`;
                                    }
                                }
                                return `<td class="p-2">${diffHTML}</td>`;
                            }).join('')}
                        </tr>
                    </tbody>
                </table>
            `;
            container.innerHTML = tableHTML;
        }
    </script>
</body>
</html>
