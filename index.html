<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- 1. HTML 메타 태그를 이용한 자동 리다이렉션 (0초 후 이동) -->
    <meta http-equiv="refresh" content="0; url=https://s3-dhcpm.s3.dualstack.ap-southeast-2.amazonaws.com/index.html">
    
    <script>
        // 2. 자바스크립트를 이용한 리다이렉션 (뒤로가기 방지를 위해 replace 사용)
        window.location.replace("https://s3-dhcpm.s3.dualstack.ap-southeast-2.amazonaws.com/index.html");
    </script>
</head>
<body>
    <p>페이지가 이동되었습니다.</p>
    <p>자동으로 이동되지 않는다면 <a href="https://s3-dhcpm.s3.dualstack.ap-southeast-2.amazonaws.com/index.html">여기</a>를 클릭해 주세요.</p>
</body>
</html>
