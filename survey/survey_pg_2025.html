                toc: [
                    { title: "Part I. 조사 개요", page: 3 },
                    { title: "Part II. 조사 결과 요약", page: 11 },
                    { title: "Part III. 조사 결과 분석", page: 15 },
                    { title: "Part IV. 시사점 및 제언", page: 39 }
                ]
            },
            "community": {
                name: "지역사회",
                icon: "fa-users",
                file: "https://dhcpm.github.io/survey/pdf/2025/2025 대구보건대학교 만족도 조사 결과보고서_지역사회_260119.pdf",
                toc: [
                    { title: "Part I. 조사 개요", page: 3 },
                    { title: "Part II. 조사 결과 요약", page: 11 },
                    { title: "Part III. 조사 결과 분석", page: 15 },
                    { title: "Part IV. 시사점 및 제언", page: 26 }
                ]
            },
            "fgi": {
                name: "FGI 조사<br><span class='text-[10px] opacity-80 font-normal'>(혁신지원사업)</span>",
                icon: "fa-comments",
                file: "https://dhcpm.github.io/survey/pdf/2025/2025 대구보건대학교 교육수요자 요구도조사 (FGI)_260124.pdf",
                toc: [
                    { title: "Part I. 조사 개요", page: 3 },
                    { title: "Part II. 주요 조사 결과", page: 5 },
                    { title: "최종 결론 (Conclusion)", page: 29 }
                ]
            },
            "department": {
                name: "부서별 만족도 조사 결과",
                icon: "fa-chart-pie",
                type: "dashboard",
                html: DASHBOARD_HTML,
                toc: [] // 대시보드는 별도 목차 없음
            }
        };

        let currentKey = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderButtons();
            
            window.addEventListener('resize', () => {
                closeSidebarOnMobile();
            });
        });

        // --- UI Logic ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function closeSidebarOnMobile() {
            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('sidebar');
                if (!sidebar.classList.contains('-translate-x-full')) {
                    toggleSidebar();
                }
            }
        }

        function renderButtons() {
            const container = document.getElementById('targetButtons');
            container.innerHTML = '';
            Object.keys(surveyData).forEach(key => {
                const item = surveyData[key];
                const btn = document.createElement('button');
                btn.className = `p-2 rounded-lg text-sm transition-all duration-200 border flex items-center justify-center gap-2 ${currentKey === key ? 'bg-teal-600 text-white border-teal-700 shadow-md transform scale-[1.02]' : 'bg-white text-gray-700 border-gray-200 hover:bg-teal-50 hover:border-teal-300'}`;
                btn.innerHTML = `<i class="fa-solid ${item.icon}"></i> <span class="text-center leading-tight">${item.name}</span>`;
                btn.onclick = () => selectTarget(key);
                container.appendChild(btn);
            });
        }

        function selectTarget(key) {
            currentKey = key;
            renderButtons();
            closeSidebarOnMobile();

            const data = surveyData[key];
            const tocList = document.getElementById('tocList');
            const initialState = document.getElementById('initialState');
            const pdfToolbar = document.getElementById('pdfToolbar');
            const fileNameDisplay = document.getElementById('currentFileName');
            const pdfContainer = document.getElementById('pdf-viewer-container');
            const loading = document.getElementById('loading');

            initialState.classList.add('hidden');
            
            // TOC 생성
            tocList.innerHTML = '';
            
            if (data.type === 'dashboard') {
                // 대시보드 모드
                pdfToolbar.classList.add('hidden'); // PDF 툴바 숨기기
                pdfToolbar.classList.remove('flex');
                
                // TOC 영역에 안내 메시지
                createTocItem(tocList, "-", "대시보드 화면입니다.");

                // 컨테이너 초기화 및 iframe 주입
                pdfContainer.innerHTML = '';
                const iframe = document.createElement('iframe');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                iframe.srcdoc = data.html;
                pdfContainer.appendChild(iframe);
                
                loading.classList.add('hidden'); // 로딩 즉시 숨김

            } else {
                // PDF 뷰어 모드
                pdfToolbar.classList.remove('hidden');
                pdfToolbar.classList.add('flex');
                fileNameDisplay.innerText = data.file.split('/').pop();

                createTocItem(tocList, 1, "표지 (Cover)");
                data.toc.forEach(item => {
                    createTocItem(tocList, item.page, item.title);
                });

                // PDF 로드
                loadPdf(data.file);
            }
        }

        function createTocItem(parent, page, title) {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="toc-item w-full text-left px-3 py-2.5 rounded-lg text-sm flex items-center group mb-1 border border-transparent">
                    <span class="toc-page-badge mr-3 font-mono">p.${page}</span>
                    <span class="truncate font-medium flex-1" title="${title}">${title}</span>
                </div>
            `;
            parent.appendChild(li);
        }

        // --- Native/Google Viewer Logic ---
        function loadPdf(url) {
            const container = document.getElementById('pdf-viewer-container');
            const loading = document.getElementById('loading');
            
            loading.classList.remove('hidden');
            container.innerHTML = '';

            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

            if (isMobile) {
                // 모바일: Google Docs Viewer
                const encodedUrl = encodeURIComponent(url);
                const iframe = document.createElement('iframe');
                // Google Docs Viewer는 문서 전체를 로딩하여 보여줌 (페이지 파라미터 미지원)
                iframe.src = `https://docs.google.com/gview?embedded=true&url=${encodedUrl}`;
                iframe.onload = () => loading.classList.add('hidden');
                container.appendChild(iframe);
            } else {
                // 데스크탑: Native Object
                const object = document.createElement('object');
                object.data = url; // 항상 1페이지부터 시작
                object.type = "application/pdf";
                object.className = "w-full h-full";
                
                const fallbackLink = document.createElement('a');
                fallbackLink.href = url;
                fallbackLink.textContent = "문서를 불러올 수 없습니다. 여기를 눌러 다운로드하세요.";
                object.appendChild(fallbackLink);

                // 로딩 완료 처리 (타임아웃 병행)
                object.onload = () => loading.classList.add('hidden');
                setTimeout(() => loading.classList.add('hidden'), 2000);
                
                container.appendChild(object);
            }
        }

        function downloadCurrentPdf() {
            if (!currentKey) return;
            const data = surveyData[currentKey];
            if (data.type === 'dashboard') return; // 대시보드는 다운로드 없음
            
            const link = document.createElement('a');
            link.href = data.file;
            link.download = data.file.split('/').pop();
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
