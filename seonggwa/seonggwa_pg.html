    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Mobile menu toggle
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            if(mobileMenuButton && mobileMenu) {
                mobileMenuButton.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                });

                const mobileMenuLinks = mobileMenu.querySelectorAll('a');
                mobileMenuLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.add('hidden');
                    });
                });
            }

            // 연도별 필터링 스크립트
            const yearSelect = document.getElementById('yearSelect');
            const items = document.querySelectorAll('.year-item');
            const years = new Set();

            // 1. 버튼 텍스트에서 연도 추출 (ex: 2025년 -> 2025)
            items.forEach(item => {
                const btn = item.querySelector('button');
                if (btn) {
                    // innerText를 사용하여 텍스트만 안전하게 가져옵니다.
                    const text = btn.innerText || btn.textContent;
                    const match = text.match(/(\d{4})년/);
                    
                    if (match) {
                        const year = match[1];
                        item.dataset.year = year; // 데이터 속성에 저장
                        years.add(year);          // 중복 방지 Set에 추가
                    }
                }
            });

            // 2. 추출된 연도를 내림차순 정렬하여 Select 옵션으로 동적 생성
            const sortedYears = Array.from(years).sort().reverse();
            sortedYears.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year + '년';
                yearSelect.appendChild(option);
            });

            // 3. Select 변경 시 필터링 동작 (애니메이션 효과 포함)
            yearSelect.addEventListener('change', (e) => {
                const selectedYear = e.target.value;
                items.forEach(item => {
                    // 애니메이션 클래스 초기화
                    item.classList.remove('fade-in');
                    
                    if (selectedYear === 'all' || item.dataset.year === selectedYear) {
                        item.style.display = 'block'; 
                        // 약간의 지연 후 애니메이션 클래스 추가
                        setTimeout(() => item.classList.add('fade-in'), 10);
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });
    </script>
