    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Element Definitions
            const analyzeBtn = document.getElementById('analyze-btn');
            const loadingStatus = document.getElementById('loading-status');
            const resultsContainer = document.getElementById('results-container');
            const combinedViewBtn = document.getElementById('combined-view-btn');
            const deptViewBtn = document.getElementById('dept-view-btn');
            const personViewBtn = document.getElementById('person-view-btn');
            const exportBtn = document.getElementById('export-btn');
            const resultsThead = document.getElementById('results-thead');
            const resultsTbody = document.getElementById('results-tbody');
            const validationContainer = document.getElementById('validation-container');
            const validationTitle = document.getElementById('validation-title');
            const departmentSelector = document.getElementById('department-selector');
            const pdfDownloadBtn = document.getElementById('pdf-download-btn');
            const tabTransform = document.getElementById('tab-transform');
            const tabSummary = document.getElementById('tab-summary');
            const tabTransformContent = document.getElementById('tab-transform-content');
            const tabSummaryContent = document.getElementById('tab-summary-content');

            // Constants
            const DATA_DIR = 'https://dhcpm.github.io/dept/result/';

            // State Variables
            let parsedData = [], departmentAnalysis = [], personAnalysis = [], allAnalysisColumns = [];
            let hasPersonColumn = false;
            let currentView = 'department';
            let currentProcessTab = 'transform';

            // --- Server File Handling ---
            async function fetchServerFiles() {
                try {
                    // 1. Fetch directory listing
                    addStatusLog(`폴더 검색 중: ${DATA_DIR}`);
                    const response = await fetch(DATA_DIR);
                    if (!response.ok) throw new Error(`폴더 접근 실패 (${response.status})`);
                    
                    const text = await response.text();
                    
                    // 2. Parse HTML to find .xlsx links (Assumes directory listing is enabled on server)
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    const links = Array.from(doc.querySelectorAll('a'));
                    
                    const fileUrls = links
                        .map(a => a.getAttribute('href'))
                        .filter(href => href && href.toLowerCase().endsWith('.xlsx'))
                        .map(href => {
                            // Handle relative paths correctly
                            try {
                                return new URL(href, response.url).href;
                            } catch (e) {
                                return href;
                            }
                        });
                    
                    const uniqueUrls = [...new Set(fileUrls)];
                    
                    if (uniqueUrls.length === 0) {
                        throw new Error("폴더 내에 엑셀 파일(.xlsx)이 없습니다.");
                    }
                    
                    addStatusLog(`총 ${uniqueUrls.length}개의 파일을 찾았습니다.`);
                    
                    // 3. Fetch each file
                    const fileDataPromises = uniqueUrls.map(async (url) => {
                        try {
                            const fileName = url.split('/').pop();
                            addStatusLog(`다운로드 중: ${fileName}...`);
                            const fileRes = await fetch(url);
                            if (!fileRes.ok) throw new Error(`다운로드 실패 (${fileRes.status})`);
                            const arrayBuffer = await fileRes.arrayBuffer();
                            return { name: fileName, data: arrayBuffer };
                        } catch (e) {
                            addStatusLog(`[오류] ${url}: ${e.message}`, true);
                            return null;
                        }
                    });
                    
                    const files = (await Promise.all(fileDataPromises)).filter(f => f !== null);
                    return files;
                    
                } catch (error) {
                    addStatusLog(`[치명적 오류] ${error.message}`, true);
                    throw error;
                }
            }

            function addStatusLog(message, isError = false) {
                const p = document.createElement('div');
                p.className = isError ? 'text-red-600 font-bold' : 'text-gray-600';
                p.textContent = `> ${message}`;
                loadingStatus.appendChild(p);
                loadingStatus.scrollTop = loadingStatus.scrollHeight;
            }

            function resetAll() {
                parsedData = [];
                departmentAnalysis = [];
                personAnalysis = [];
                allAnalysisColumns = [];
                hasPersonColumn = false;
                
                resultsContainer.classList.add('hidden');
                validationContainer.classList.add('hidden');
                departmentSelector.innerHTML = '';
                tabTransformContent.innerHTML = '';
                tabSummaryContent.innerHTML = '';
                loadingStatus.innerHTML = '';
                loadingStatus.classList.add('hidden');
            }

            // --- Event Listeners ---
            analyzeBtn.addEventListener('click', async () => {
                resetAll();
                loadingStatus.classList.remove('hidden');
                analyzeBtn.disabled = true;
                const originalBtnText = analyzeBtn.innerHTML;
                analyzeBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>데이터 가져오는 중...`;
                
                try {
                    // Fetch files from server
                    const fetchedFiles = await fetchServerFiles();
                    
                    if (fetchedFiles.length === 0) {
                        throw new Error("분석할 파일이 없습니다.");
                    }

                    addStatusLog(`데이터 병합 및 분석 시작...`);

                    // Parse Excel Data
                    const allJsonData = await Promise.all(fetchedFiles.map(file => 
                        new Promise((resolve) => {
                            try {
                                const workbook = XLSX.read(new Uint8Array(file.data), { type: 'array' });
                                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                                resolve(XLSX.utils.sheet_to_json(worksheet, { defval: "" }));
                            } catch (error) {
                                addStatusLog(`[파싱 오류] ${file.name}: ${error.message}`, true);
                                resolve([]); // Skip failed files
                            }
                        })
                    ));
                    
                    parsedData = [].concat(...allJsonData).map(row => 
                        Object.fromEntries(Object.entries(row).map(([key, value]) => [key.trim(), value]))
                    );

                    if (parsedData.length === 0) throw new Error("파일 처리 후 유효한 데이터가 없습니다.");

                    // Validate Headers
                    const firstRowHeaders = Object.keys(parsedData[0] || {});
                    ['부서명', '페이지', '총점'].forEach(col => {
                        if (!firstRowHeaders.includes(col)) throw new Error(`필수 항목 '${col}'이(가) 없습니다.`);
                    });

                    // Identify Analysis Columns
                    const analysisColumnsSet = new Set();
                    parsedData.forEach(row => {
                        const headers = Object.keys(row);
                        const pageIndex = headers.indexOf('페이지');
                        const totalScoreIndex = headers.indexOf('총점');
                        if (pageIndex !== -1 && totalScoreIndex !== -1 && pageIndex < totalScoreIndex) {
                            headers.slice(pageIndex + 1, totalScoreIndex).forEach(col => analysisColumnsSet.add(col));
                        }
                    });
                    allAnalysisColumns = Array.from(analysisColumnsSet);
                    hasPersonColumn = parsedData.some(row => '담당자' in row && row['담당자']);
                    
                    // Perform Analysis
                    performAnalysis();
                    populateDepartmentSelector();
                    updateUIVisibility();
                    renderTable();
                    
                    resultsContainer.classList.remove('hidden');
                    validationContainer.classList.remove('hidden');
                    addStatusLog(`분석 완료!`);
                    
                    // Success Alert
                    setTimeout(() => {
                        alert("모든 결과분석이 완료되었습니다. 결과페이지에서 결과를 확인하세요");
                    }, 100);

                } catch (error) {
                    console.error("Analysis failed:", error);
                    alert(`분석 중 오류 발생: ${error.message}`);
                    addStatusLog(`[종료] ${error.message}`, true);
                } finally {
                    analyzeBtn.disabled = false;
                    analyzeBtn.innerHTML = originalBtnText;
                }
            });

            // --- Core Analysis Logic (Same as before) ---
            function parseValueToNumber(value) {
                if (typeof value === 'number') return value;
                if (typeof value !== 'string') return NaN;
                const match = value.match(/(-?\d+(\.\d+)?)/);
                return match ? parseFloat(match[0]) : NaN;
            }

            function performAnalysis() {
                // Department Analysis
                const deptAggregates = {};
                parsedData.forEach(row => {
                    const dept = row['부서명'];
                    if (!dept) return;
                    if (!deptAggregates[dept]) {
                        deptAggregates[dept] = { totals: {}, counts: {} };
                        allAnalysisColumns.forEach(col => {
                            deptAggregates[dept].totals[col] = 0;
                            deptAggregates[dept].counts[col] = 0;
                        });
                    }
                    allAnalysisColumns.forEach(col => {
                        if (row.hasOwnProperty(col)) {
                            const value = parseValueToNumber(row[col]);
                            if (!isNaN(value)) {
                                deptAggregates[dept].totals[col] += value;
                                deptAggregates[dept].counts[col]++;
                            }
                        }
                    });
                });

                departmentAnalysis = Object.keys(deptAggregates).map(dept => {
                    const result = { '부서명': dept };
                    let totalSum = 0;
                    allAnalysisColumns.forEach(col => {
                        const total = deptAggregates[dept].totals[col];
                        const count = deptAggregates[dept].counts[col];
                        const average = count > 0 ? total / count : 0;
                        result[col] = average;
                        totalSum += average;
                    });
                    result['총점'] = totalSum;
                    return result;
                });

                departmentAnalysis.sort((a, b) => b['총점'] - a['총점']);
                departmentAnalysis.forEach((dept, index) => {
                    dept['순위'] = (index > 0 && dept['총점'] === departmentAnalysis[index - 1]['총점'])
                        ? departmentAnalysis[index - 1]['순위']
                        : index + 1;
                });

                const departmentAverageMap = new Map();
                departmentAnalysis.forEach(d => {
                    const averages = {};
                    allAnalysisColumns.forEach(col => averages[col] = d[col]);
                    departmentAverageMap.set(d['부서명'], averages);
                });


                // Person Analysis
                if (hasPersonColumn) {
                    const personAggregates = {};
                    parsedData.forEach(row => {
                        const dept = row['부서명'], person = row['담당자'];
                        if (!dept || !person) return;
                        const key = `${dept}_${person}`;
                        if (!personAggregates[key]) {
                            personAggregates[key] = { '부서명': dept, '담당자': person, totals: {}, counts: {} };
                            allAnalysisColumns.forEach(col => {
                                personAggregates[key].totals[col] = 0;
                                personAggregates[key].counts[col] = 0;
                            });
                        }
                        allAnalysisColumns.forEach(col => {
                            if (row.hasOwnProperty(col)) {
                                const value = parseValueToNumber(row[col]);
                                if (!isNaN(value)) {
                                    personAggregates[key].totals[col] += value;
                                    personAggregates[key].counts[col]++;
                                }
                            }
                        });
                    });
                    personAnalysis = Object.values(personAggregates).map(agg => {
                        const result = { '부서명': agg['부서명'], '담당자': agg['담당자'] };
                        let totalSum = 0;
                        const departmentAverages = departmentAverageMap.get(agg['부서명']);
                        allAnalysisColumns.forEach(col => {
                            const total = agg.totals[col], count = agg.counts[col];
                            let personAverage = count > 0 ? total / count : 0;
                            const finalAverage = (personAverage === 0 && departmentAverages) ? departmentAverages[col] : personAverage;
                            result[col] = finalAverage;
                            totalSum += finalAverage;
                        });
                        result['총점'] = totalSum;
                        return result;
                    });
                    
                    personAnalysis.sort((a, b) => b['총점'] - a['총점']);
                    personAnalysis.forEach((person, index) => {
                        person['순위'] = (index > 0 && person['총점'] === personAnalysis[index - 1]['총점'])
                            ? personAnalysis[index - 1]['순위']
                            : index + 1;
                    });
                }
            }
            
            // --- Rendering ---
            function populateDepartmentSelector() {
                departmentSelector.innerHTML = '<option value="">-- 부서 선택 --</option>';
                const sortedDepts = [...departmentAnalysis].sort((a, b) => a['부서명'].localeCompare(b['부서명']));
                sortedDepts.forEach(dept => {
                    departmentSelector.add(new Option(dept['부서명'], dept['부서명']));
                });
                departmentSelector.value = '';
                pdfDownloadBtn.disabled = true;
                validationTitle.textContent = '데이터 분석 과정';
                tabTransformContent.innerHTML = '';
                tabSummaryContent.innerHTML = '';
            }
            
            departmentSelector.addEventListener('change', (e) => {
                const selectedDept = e.target.value;
                pdfDownloadBtn.disabled = !selectedDept;
                if (selectedDept) {
                    renderCalculationProcess(selectedDept);
                } else {
                    validationTitle.textContent = '데이터 분석 과정';
                    tabTransformContent.innerHTML = '';
                    tabSummaryContent.innerHTML = '';
                }
            });
            
            function generateCalculationProcess(departmentName) {
                const processData = [];
                const summary = {};
                const validationData = parsedData.filter(row => row['부서명'] === departmentName);

                if (validationData.length === 0) return { processData, summary };
                
                allAnalysisColumns.forEach(col => { summary[col] = { values: [], sum: 0, count: 0 }; });

                validationData.forEach((row, index) => {
                    const processRecord = {
                        id: `row-${index}`,
                        work: row['업무명'] || '-',
                        person: row['담당자'] || '-',
                        steps: []
                    };
                    allAnalysisColumns.forEach(col => {
                        if (row.hasOwnProperty(col)) {
                            const originalValue = row[col];
                            const parsedValue = parseValueToNumber(originalValue);
                            const success = !isNaN(parsedValue);
                            processRecord.steps.push({ item: col, value: originalValue, parsed: parsedValue, success: success });
                            if (success) {
                                summary[col].values.push(parsedValue);
                                summary[col].sum += parsedValue;
                                summary[col].count++;
                            }
                        }
                    });
                    processData.push(processRecord);
                });
                allAnalysisColumns.forEach(col => {
                    summary[col].average = summary[col].count > 0 ? summary[col].sum / summary[col].count : 0;
                });
                return { processData, summary };
            }

            function renderCalculationProcess(departmentName) {
                const { processData, summary } = generateCalculationProcess(departmentName);
                
                validationTitle.textContent = `${departmentName} 데이터 분석 과정`;
                tabTransformContent.innerHTML = '';
                tabSummaryContent.innerHTML = '';

                if (processData.length === 0) {
                    const noDataMessage = `<div class="text-center text-gray-500 p-4">선택한 부서의 데이터가 없습니다.</div>`;
                    tabTransformContent.innerHTML = noDataMessage;
                    tabSummaryContent.innerHTML = noDataMessage;
                    return;
                }

                // Render Transform Tab
                processData.forEach(record => {
                    const card = document.createElement('div');
                    card.className = 'bg-gray-50 p-4 rounded-lg shadow-sm border border-gray-200';
                    card.innerHTML = `<h3 class="font-bold text-lg text-gray-800">[${record.work}] <span class="font-normal text-gray-600">| 담당자: ${record.person}</span></h3>`;
                    const list = document.createElement('ul');
                    list.className = 'list-disc list-inside mt-3 text-sm space-y-2 pl-2';
                    record.steps.forEach(step => {
                        const statusHtml = step.success 
                            ? `숫자 <strong class="text-blue-600">${step.parsed}</strong> (으)로 변환 <span class="text-green-600 font-semibold">성공</span>`
                            : `숫자 추출 <span class="text-red-600 font-semibold">실패</span> (평균 계산에서 제외)`;
                        list.innerHTML += `<li><strong>'${step.item}'</strong> 항목: 원본 값 <code class="bg-gray-200 text-gray-700 px-1 py-0.5 rounded text-xs">${step.value}</code> &rarr; ${statusHtml}</li>`;
                    });
                    card.appendChild(list);
                    tabTransformContent.appendChild(card);
                });
                
                // Render Summary Tab
                const summaryGrid = document.createElement('div');
                summaryGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';
                allAnalysisColumns.forEach(col => {
                    const colSummary = summary[col];
                    if (colSummary && colSummary.count > 0) {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'bg-blue-50 p-4 rounded-lg shadow-sm border border-blue-200 text-sm space-y-1';
                        itemDiv.innerHTML = `
                            <p class="font-semibold text-gray-700">평가항목: ${col}</p>
                            <p>&bull; 계산에 사용된 값: <span class="font-mono text-blue-700">[${colSummary.values.join(', ')}]</span></p>
                            <p>&bull; 합계: <span class="font-mono text-gray-800">${colSummary.values.join(' + ')} = <strong>${colSummary.sum}</strong></span></p>
                            <p>&bull; 데이터 개수: <strong>${colSummary.count}</strong>개</p>
                            <p>&bull; 최종 평균: <span class="font-mono text-gray-800">${colSummary.sum} / ${colSummary.count} = <strong class="text-lg text-blue-600">${colSummary.average.toFixed(2)}</strong></span></p>`;
                        summaryGrid.appendChild(itemDiv);
                    }
                });
                tabSummaryContent.appendChild(summaryGrid);
            }

            function updateUIVisibility() {
                personViewBtn.style.display = hasPersonColumn ? 'inline-block' : 'none';
                currentView = 'dept';
                setActiveButton(deptViewBtn);
                setActiveTab(tabTransform);
            }

            function renderTable() {
                let data, headers;
                switch (currentView) {
                    case 'dept':
                        data = departmentAnalysis;
                        headers = ['부서명', ...allAnalysisColumns, '총점', '순위'];
                        break;
                    case 'person':
                        data = personAnalysis;
                        headers = ['부서명', '담당자', ...allAnalysisColumns, '총점', '순위'];
                        break;
                    case 'combined':
                        data = parsedData;
                        headers = data.length > 0 ? Object.keys(data[0]) : [];
                        break;
                    default:
                        data = []; headers = [];
                }
                
                resultsThead.innerHTML = `<tr>${headers.map(h => `<th class="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase tracking-wider whitespace-nowrap">${h}</th>`).join('')}</tr>`;
                
                resultsTbody.innerHTML = data.map(row => 
                    `<tr>${headers.map(h => {
                        const val = row[h];
                        const isNumeric = typeof val === 'number';
                        const displayValue = (currentView !== 'combined' && isNumeric && h !== '순위') ? val.toFixed(2) : (val !== undefined ? val : '');
                        const cellClass = (isNumeric || h === '순위') ? 'text-right' : 'text-left';
                        return `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 ${cellClass}">${displayValue}</td>`;
                    }).join('')}</tr>`
                ).join('');
            }

            function setActiveButton(activeBtn) {
                [combinedViewBtn, deptViewBtn, personViewBtn].forEach(btn => btn.classList.remove('bg-white', 'text-blue-600', 'shadow'));
                activeBtn.classList.add('bg-white', 'text-blue-600', 'shadow');
            }

            function setActiveTab(activeTab) {
                currentProcessTab = activeTab.id === 'tab-transform' ? 'transform' : 'summary';
                [tabTransform, tabSummary].forEach(tab => tab.classList.remove('tab-button-active', 'tab-button-inactive'));
                tabTransform.classList.add(currentProcessTab === 'transform' ? 'tab-button-active' : 'tab-button-inactive');
                tabSummary.classList.add(currentProcessTab === 'summary' ? 'tab-button-active' : 'tab-button-inactive');
                tabTransformContent.classList.toggle('hidden', currentProcessTab !== 'transform');
                tabSummaryContent.classList.toggle('hidden', currentProcessTab !== 'summary');
            }
            
            [combinedViewBtn, deptViewBtn, personViewBtn].forEach(btn => {
                btn.addEventListener('click', () => {
                    currentView = btn.id.replace('-view-btn', '');
                    setActiveButton(btn);
                    renderTable();
                });
            });

            [tabTransform, tabSummary].forEach(tab => tab.addEventListener('click', () => setActiveTab(tab)));
            
            exportBtn.addEventListener('click', () => {
                let dataToExport;
                switch(currentView) {
                    case 'dept': dataToExport = departmentAnalysis; break;
                    case 'person': dataToExport = personAnalysis; break;
                    case 'combined': dataToExport = parsedData; break;
                    default: dataToExport = [];
                }
                if (dataToExport.length === 0) { alert('반출할 데이터가 없습니다.'); return; }
                
                const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Analysis Results");
                XLSX.writeFile(workbook, `${currentView}_analysis_export.xlsx`);
            });

            pdfDownloadBtn.addEventListener('click', async () => {
                const selectedDept = departmentSelector.value;
                if (!selectedDept) { alert('부서를 먼저 선택해주세요.'); return; }
                
                const elementToCapture = currentProcessTab === 'transform' ? tabTransformContent : tabSummaryContent;
                const fileName = `${selectedDept}_${currentProcessTab === 'transform' ? '데이터_변환_과정' : '최종_평균_산출'}.pdf`;

                pdfDownloadBtn.disabled = true;
                pdfDownloadBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 생성 중...`;

                try {
                    const canvas = await html2canvas(elementToCapture, { scale: 2 });
                    const imgData = canvas.toDataURL('image/png');
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');
                    const imgProps = doc.getImageProperties(imgData);
                    const pdfWidth = doc.internal.pageSize.getWidth();
                    const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    let heightLeft = pdfHeight;
                    let position = 0;
                    
                    doc.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
                    heightLeft -= doc.internal.pageSize.getHeight();

                    while (heightLeft > 0) {
                        position = heightLeft - pdfHeight;
                        doc.addPage();
                        doc.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
                        heightLeft -= doc.internal.pageSize.getHeight();
                    }
                    doc.save(fileName);
                } catch(e) {
                    alert('PDF 생성 중 오류가 발생했습니다.');
                    console.error(e);
                } finally {
                    pdfDownloadBtn.disabled = false;
                    pdfDownloadBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> PDF로 다운로드`;
                }
            });

            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenuButton.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
        });
    </script>
</body>
