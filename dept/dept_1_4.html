            <!-- 테이블 컨테이너 (스크롤 가능) -->

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Mobile menu toggle
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenuButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        
            // 데이터를 모두 삭제하고 헤더만 남겼습니다. 파일 업로드 시 이 변수가 업데이트됩니다.
            let csvData = `부서명,지표기준,지표명,21,22,23,실적평균,2024목표,2024달성,2024 달성률,특이사항,권역평균값,목표값 설정의 적절성,목표값 달성도
`;

            /**
             * CSV 형식의 문자열 한 줄을 파싱하여 셀 데이터 배열로 변환합니다.
             */
            function parseCsvLine(line) {
                const values = [];
                let currentVal = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (inQuotes && line[i + 1] === '"') {
                            currentVal += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        values.push(currentVal);
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                values.push(currentVal);
                return values;
            }

            /**
             * CSV 데이터를 기반으로 HTML 테이블을 생성합니다.
             */
            function createTable() {
                const tableHeader = document.getElementById('table-header');
                const tableBody = document.getElementById('table-body');
                tableHeader.innerHTML = '';
                tableBody.innerHTML = '';

                const lines = csvData.trim().split('\n');
                if (lines.length === 0 || (lines.length === 1 && lines[0].trim() === '')) {
                    return; // 데이터가 없으면 아무것도 하지 않음
                }

                const headers = lines.shift().split(',');
                const headerRow = document.createElement('tr');
                headers.forEach(headerText => {
                    const th = document.createElement('th');
                    th.className = 'px-6 py-3'; // 스타일 추가
                    th.scope = 'col';
                    th.textContent = headerText.trim();
                    headerRow.appendChild(th);
                });
                tableHeader.appendChild(headerRow);

                lines.forEach(line => {
                    if (line.trim() === '') return;
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50';
                    const cells = parseCsvLine(line.trim());
                    cells.forEach(cellText => {
                        const td = document.createElement('td');
                        td.className = 'px-6 py-4 whitespace-nowrap'; // 스타일 추가
                        td.contentEditable = true;
                        td.textContent = cellText.trim();
                        row.appendChild(td);
                    });
                    tableBody.appendChild(row);
                });
            }
            
            /**
             * '2024 달성률'을 계산하고 테이블을 업데이트합니다.
             */
            function calculateAchievementRate() {
                const tableHeader = document.querySelector('#table-header tr');
                if (!tableHeader) {
                    alert("데이터가 없습니다. 먼저 파일을 업로드해주세요.");
                    return;
                }
                const tableBody = document.getElementById('table-body');
                const rows = tableBody.querySelectorAll('tr');

                const headers = Array.from(tableHeader.querySelectorAll('th')).map(th => th.textContent.trim());
                const indices = {
                    standard: headers.indexOf('지표기준'),
                    target: headers.indexOf('2024목표'),
                    achieved: headers.indexOf('2024달성'),
                    rate: headers.indexOf('2024 달성률'),
                    notes: headers.indexOf('특이사항'),
                    avg: headers.indexOf('권역평균값')
                };

                if (Object.values(indices).some(index => index === -1)) {
                    console.error("하나 이상의 필수 열을 테이블 헤더에서 찾을 수 없습니다:", indices);
                    alert("계산에 필요한 열(예: 지표기준, 2024목표)을 찾을 수 없습니다. 업로드한 파일의 헤더를 확인해주세요.");
                    return;
                }

                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    const notes = cells[indices.notes].textContent.trim();
                    
                    if (notes.includes('평가제외')) {
                        cells[indices.rate].textContent = ''; 
                        return; 
                    }

                    const standard = cells[indices.standard].textContent.trim();
                    const parseNumber = (text) => parseFloat(String(text).replace(/,/g, '')) || 0;
                    
                    let achievementRate = 0;

                    if (notes.includes('권역평균')) {
                        const achieved = parseNumber(cells[indices.achieved].textContent);
                        const avg = parseNumber(cells[indices.avg].textContent);

                        if (standard === '상향') {
                            achievementRate = (avg !== 0) ? (achieved / avg) * 100 : 0;
                        } else if (standard === '하향') {
                            achievementRate = (achieved !== 0) ? (avg / achieved) * 100 : 0;
                        }
                    } else {
                        const target = parseNumber(cells[indices.target].textContent);
                        const achieved = parseNumber(cells[indices.achieved].textContent);

                        if (standard === '상향') {
                            achievementRate = (target !== 0) ? (achieved / target) * 100 : 0;
                        } else if (standard === '하향') {
                            achievementRate = (achieved !== 0) ? (target / achieved) * 100 : 0;
                        }
                    }
                    cells[indices.rate].textContent = achievementRate.toFixed(2);
                });
            }

            /**
             * '목표값 설정의 적절성'을 계산하고 테이블을 업데이트합니다.
             */
            function calculateAdequacy() {
                const tableHeader = document.querySelector('#table-header tr');
                if (!tableHeader) {
                    alert("데이터가 없습니다. 먼저 파일을 업로드해주세요.");
                    return;
                }
                const tableBody = document.getElementById('table-body');
                const rows = tableBody.querySelectorAll('tr');

                const headers = Array.from(tableHeader.querySelectorAll('th')).map(th => th.textContent.trim());
                const indices = {
                    rate: headers.indexOf('2024 달성률'),
                    target: headers.indexOf('2024목표'),
                    performanceAvg: headers.indexOf('실적평균'),
                    notes: headers.indexOf('특이사항'),
                    adequacy: headers.indexOf('목표값 설정의 적절성'),
                    regionalAvg: headers.indexOf('권역평균값')
                };

                if (Object.values(indices).some(index => index === -1)) {
                    console.error("하나 이상의 필수 열을 테이블 헤더에서 찾을 수 없습니다:", indices);
                    alert("적절성 계산에 필요한 열(예: 2024 달성률, 실적평균, 권역평균값)을 찾을 수 없습니다. 파일 헤더를 확인해주세요.");
                    return;
                }

                const parseNumber = (text) => parseFloat(String(text).replace(/,/g, '')) || 0;

                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    const notes = cells[indices.notes].textContent.trim();
                    
                    if (notes.includes('평가제외')) {
                        cells[indices.adequacy].textContent = ''; 
                        return; 
                    }
                    
                    const achievementRate = parseNumber(cells[indices.rate].textContent);
                    const target2024 = parseNumber(cells[indices.target].textContent);
                    let score = 0;
                    let comparisonValue = 0;

                    // '특이사항'에 '권역평균'이 있는지에 따라 비교 대상을 결정합니다.
                    if (notes.includes('권역평균')) {
                        comparisonValue = parseNumber(cells[indices.regionalAvg].textContent);
                    } else {
                        comparisonValue = parseNumber(cells[indices.performanceAvg].textContent);
                    }

                    // 점수 산정 로직
                    if (achievementRate >= 100) {
                        if (target2024 > comparisonValue) {
                            score = 10;
                        } else if (target2024 === comparisonValue) {
                            score = 9;
                        } else {
                            score = 8;
                        }
                    } else { // achievementRate < 100
                        if (target2024 > comparisonValue) {
                            score = 7;
                        } else if (target2024 === comparisonValue) {
                            score = 6;
                        } else {
                            score = 5;
                        }
                    }
                    
                    cells[indices.adequacy].textContent = score;
                });
            }

            /**
             * '목표값 달성도'를 계산하고 테이블을 업데이트합니다.
             */
            function calculateAchievementLevel() {
                const tableHeader = document.querySelector('#table-header tr');
                if (!tableHeader) {
                    alert("데이터가 없습니다. 먼저 파일을 업로드해주세요.");
                    return;
                }
                const tableBody = document.getElementById('table-body');
                const rows = tableBody.querySelectorAll('tr');

                const headers = Array.from(tableHeader.querySelectorAll('th')).map(th => th.textContent.trim());
                const indices = {
                    rate: headers.indexOf('2024 달성률'),
                    notes: headers.indexOf('특이사항'),
                    level: headers.indexOf('목표값 달성도')
                };

                if (Object.values(indices).some(index => index === -1)) {
                    console.error("하나 이상의 필수 열을 테이블 헤더에서 찾을 수 없습니다:", indices);
                    alert("달성도 계산에 필요한 열(예: 2024 달성률)을 찾을 수 없습니다. 파일 헤더를 확인해주세요.");
                    return;
                }

                const parseNumber = (text) => parseFloat(String(text).replace(/,/g, '')) || 0;

                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    const notes = cells[indices.notes].textContent.trim();
                    
                    if (notes.includes('평가제외')) {
                        cells[indices.level].textContent = '';
                        return;
                    }
                    
                    const achievementRate = parseNumber(cells[indices.rate].textContent);
                    let score = 0;

                    if (achievementRate >= 100) {
                        score = 15;
                    } else if (achievementRate >= 90) {
                        score = 14;
                    } else if (achievementRate >= 80) {
                        score = 13;
                    } else if (achievementRate >= 70) {
                        score = 12;
                    } else if (achievementRate >= 60) {
                        score = 11;
                    } else if (achievementRate >= 50) {
                        score = 10;
                    } else if (achievementRate >= 40) {
                        score = 9;
                    } else {
                        score = 8;
                    }
                    
                    cells[indices.level].textContent = score;
                });
            }
            
            /**
             * 현재 테이블 데이터를 엑셀 파일로 내보냅니다.
             */
            function exportToExcel() {
                const tableHeader = document.querySelector('#table-header tr');
                const tableBody = document.getElementById('table-body');
                if (!tableHeader || tableBody.rows.length === 0) {
                    alert("내보낼 데이터가 없습니다.");
                    return;
                }

                const dataToExport = [];
                // 헤더 데이터 추출
                const headers = Array.from(tableHeader.querySelectorAll('th')).map(th => th.textContent.trim());
                dataToExport.push(headers);
                
                // 본문 데이터 추출
                tableBody.querySelectorAll('tr').forEach(row => {
                    const rowData = Array.from(row.querySelectorAll('td')).map(td => td.textContent.trim());
                    dataToExport.push(rowData);
                });

                // SheetJS를 사용하여 엑셀 파일 생성
                const worksheet = XLSX.utils.aoa_to_sheet(dataToExport);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "평가점수결과");

                // 파일 다운로드 트리거
                XLSX.writeFile(workbook, "평가점수결과.xlsx");
            }


            /**
             * 파일 업로드 이벤트를 처리합니다.
             */
            function handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();

                reader.onload = (e) => {
                    try {
                        const data = e.target.result;
                        if (file.name.endsWith('.csv')) {
                            // BOM 제거
                            if (data.charCodeAt(0) === 0xFEFF) {
                                csvData = data.substring(1);
                            } else {
                                csvData = data;
                            }
                        } else {
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            csvData = XLSX.utils.sheet_to_csv(worksheet);
                        }
                        createTable(); // 새 데이터로 테이블을 다시 렌더링
                    } catch (error) {
                        console.error("파일 처리 중 오류 발생:", error);
                        alert("파일 처리 중 오류가 발생했습니다. 파일이 손상되었거나 형식이 올바르지 않을 수 있습니다.");
                    }
                };
                
                reader.onerror = () => {
                    console.error("파일 읽기 오류:", reader.error);
                    alert("파일을 읽는 중 오류가 발생했습니다.");
                };

                if (file.name.endsWith('.csv')) {
                    reader.readAsText(file, 'UTF-8');
                } else if (file.name.endsWith('.xls') || file.name.endsWith('.xlsx')) {
                    reader.readAsArrayBuffer(file);
                } else {
                    alert("지원하지 않는 파일 형식입니다. .csv, .xls, .xlsx 파일을 업로드해주세요.");
                }
            }
            
            // 기존 코드와 달리, DOMContentLoaded 내에서 모든 것을 실행합니다.
            createTable();
            document.getElementById('calculate-btn').addEventListener('click', calculateAchievementRate);
            document.getElementById('calculate-adequacy-btn').addEventListener('click', calculateAdequacy);
            document.getElementById('calculate-achievement-level-btn').addEventListener('click', calculateAchievementLevel);
            document.getElementById('export-btn').addEventListener('click', exportToExcel);

            document.getElementById('refresh-btn').addEventListener('click', () => {
                location.reload();
            });

            const uploadBtn = document.getElementById('upload-btn');
            const fileInput = document.getElementById('file-input');

            uploadBtn.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', handleFileUpload);

        });
    </script>
</body>
