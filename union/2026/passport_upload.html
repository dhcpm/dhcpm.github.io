<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여권 업로드</title>
    <!-- Tailwind CSS를 사용하여 깔끔하고 모던한 UI 구성 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 드래그 앤 드롭 시 부드러운 전환 효과 */
        .drop-zone { transition: all 0.3s ease; }
        .drop-zone.dragover { 
            background-color: #f0fdf4; 
            border-color: #22c55e; 
            transform: scale(1.02);
        }
        /* 페이드 인 애니메이션 */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- 메인 업로드 카드 -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
        
        <!-- 헤더 섹션 -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">여권 사본 업로드</h1>
            <p class="text-slate-500 text-sm">
                신원 확인을 위해 여권의 정보면을 업로드해 주세요.<br>
                <span class="text-emerald-600 font-medium bg-emerald-50 px-2 py-1 rounded-md mt-2 inline-block">
                    저장 위치: 같은 폴더 (현재 위치)
                </span>
            </p>
        </div>

        <!-- 드래그 앤 드롭 영역 -->
        <div id="dropZone" class="drop-zone border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:bg-slate-50 hover:border-emerald-400 group">
            <input type="file" id="fileInput" class="hidden" accept="image/jpeg, image/png, application/pdf" />
            
            <div class="w-16 h-16 mx-auto mb-4 bg-emerald-100 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
                <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                </svg>
            </div>
            
            <p class="text-slate-700 font-semibold mb-1">클릭하거나 파일을 이곳으로 드래그 하세요</p>
            <p class="text-xs text-slate-400">지원 형식: JPG, PNG, PDF (최대 5MB)</p>
        </div>

        <!-- 파일 미리보기 영역 (초기엔 숨김) -->
        <div id="previewArea" class="hidden mt-6 bg-slate-50 rounded-lg p-4 border border-slate-200 fade-in">
            <div class="flex items-center space-x-4">
                <!-- 이미지 미리보기 -->
                <img id="imagePreview" src="" alt="미리보기" class="w-14 h-14 object-cover rounded-md shadow-sm hidden">
                <!-- PDF 아이콘 -->
                <div id="pdfIcon" class="w-14 h-14 bg-red-100 text-red-500 rounded-md flex items-center justify-center shadow-sm hidden">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"></path></svg>
                </div>
                
                <!-- 파일 정보 -->
                <div class="flex-1 overflow-hidden">
                    <p id="fileName" class="text-sm font-semibold text-slate-700 truncate">filename.jpg</p>
                    <p id="fileSize" class="text-xs text-slate-500">0 KB</p>
                </div>
                
                <!-- 삭제 버튼 -->
                <button id="removeBtn" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors focus:outline-none" title="파일 삭제">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>

        <!-- 업로드 상태 바 (초기엔 숨김) -->
        <div id="uploadStatus" class="hidden mt-6 fade-in">
            <div class="flex justify-between text-xs mb-1">
                <span id="statusText" class="text-emerald-600 font-semibold">업로드 준비 완료</span>
                <span id="progressText" class="text-slate-500">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2">
                <div id="progressBar" class="bg-emerald-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- 최종 성공 메시지 영역 -->
        <div id="successMessage" class="hidden mt-6 p-4 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-700 text-sm text-center fade-in">
            <svg class="w-6 h-6 mx-auto mb-2 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            성공적으로 업로드되었습니다!<br>파일이 <strong>현재 폴더에</strong> 저장되었습니다.
        </div>

        <!-- 업로드 실행 버튼 -->
        <button id="uploadBtn" disabled class="mt-6 w-full bg-emerald-600 text-white font-semibold py-3.5 rounded-xl shadow-md hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-500/30 disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-[0.98]">
            서버로 파일 전송
        </button>
    </div>

    <!-- JavaScript 로직 -->
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const imagePreview = document.getElementById('imagePreview');
        const pdfIcon = document.getElementById('pdfIcon');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeBtn = document.getElementById('removeBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        
        const uploadStatus = document.getElementById('uploadStatus');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const successMessage = document.getElementById('successMessage');

        let currentFile = null;

        // --- 1. 드래그 앤 드롭 및 파일 선택 이벤트 처리 ---
        
        // 클릭 시 파일 탐색기 열기
        dropZone.addEventListener('click', () => fileInput.click());

        // 파일 탐색기에서 파일 선택 시
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        // 드래그 앤 드롭 이벤트 방지 및 스타일링
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        // 파일 드롭 시
        dropZone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });


        // --- 2. 파일 정보 읽기 및 미리보기 ---
        
        function handleFile(file) {
            // 초기화
            resetUploadUI();
            
            // 파일 용량 체크 (5MB 제한)
            if (file.size > 5 * 1024 * 1024) {
                alert('파일 크기는 5MB를 초과할 수 없습니다.');
                return;
            }

            currentFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatBytes(file.size);
            
            // 이미지인지 PDF인지 확인하여 아이콘/미리보기 표시
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                    pdfIcon.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            } else if (file.type === 'application/pdf') {
                imagePreview.classList.add('hidden');
                pdfIcon.classList.remove('hidden');
            } else {
                alert('JPG, PNG, PDF 형식의 파일만 지원합니다.');
                currentFile = null;
                return;
            }

            // UI 업데이트
            dropZone.classList.add('hidden');
            previewArea.classList.remove('hidden');
            uploadBtn.disabled = false;
        }

        // 파일 삭제 버튼
        removeBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 부모 클릭 이벤트 방지
            currentFile = null;
            fileInput.value = '';
            
            resetUploadUI();
            
            previewArea.classList.add('hidden');
            dropZone.classList.remove('hidden');
            uploadBtn.disabled = true;
        });


        // --- 3. 업로드 시뮬레이션 ---
        
        uploadBtn.addEventListener('click', () => {
            if (!currentFile) return;

            // UI 변경
            uploadBtn.disabled = true;
            removeBtn.classList.add('hidden'); // 업로드 중 삭제 방지
            uploadStatus.classList.remove('hidden');
            statusText.textContent = '현재 폴더로 전송 중...';
            
            let progress = 0;
            
            // setInterval을 이용해 서버 업로드 딜레이 시뮬레이션
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 15) + 5; // 5~20씩 랜덤 증가
                
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    // 업로드 완료 처리
                    setTimeout(() => {
                        uploadStatus.classList.add('hidden');
                        previewArea.classList.add('hidden');
                        uploadBtn.classList.add('hidden');
                        successMessage.classList.remove('hidden');
                    }, 500);
                }
                
                progressBar.style.width = `${progress}%`;
                progressText.textContent = `${progress}%`;
            }, 300);
        });


        // --- 유틸리티 함수 ---
        
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function resetUploadUI() {
            uploadStatus.classList.add('hidden');
            successMessage.classList.add('hidden');
            progressBar.style.width = '0%';
            progressText.textContent = '0%';
            statusText.textContent = '업로드 준비 완료';
            removeBtn.classList.remove('hidden');
            uploadBtn.classList.remove('hidden');
            uploadBtn.textContent = '서버로 파일 전송';
        }

    </script>
</body>
</html>
