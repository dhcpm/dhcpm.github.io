<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대학평의원회 회의록 요약 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 text-white flex flex-col h-full shadow-xl z-10 transition-all duration-300 sm:w-72">
        <div class="p-6 bg-slate-900 border-b border-slate-700 flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-book-open text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide">회의록 요약</h1>
                <p class="text-xs text-slate-400">대구보건대학교평의원회</p>
            </div>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4" id="sidebarMenu">
            <!-- Year and Session menu will be dynamically rendered here -->
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50">
        <!-- Topbar -->
        <header class="bg-white shadow-sm border-b border-gray-200 p-4 sm:p-6 flex justify-between items-center z-0">
            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2" id="headerTitle">
                <!-- Title dynamically updated -->
                <i class="fa-regular fa-calendar-check text-blue-500"></i> 선택된 회의록
            </h2>
        </header>

        <!-- Content scrollable area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-8" id="mainContent">
            <!-- Dynamic content will be injected here -->
            <div class="flex h-full items-center justify-center text-gray-400">
                <div class="text-center">
                    <i class="fa-regular fa-hand-pointer text-4xl mb-3"></i>
                    <p>좌측 메뉴에서 연도와 회차를 선택해주세요.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        /* 
         * [데이터 구조] 
         * 이 data 객체에 계속해서 새로운 연도와 회차 배열을 추가하면 
         * UI에 자동으로 반영되는 확장 가능한 구조입니다.
         */
        const meetingData = {
            "2026": [
                {
                    id: 1,
                    title: "2026학년도 제1차 대구보건대학교평의원회",
                    date: "2026년 5월 12일(화)",
                    time: "16:30~18:00",
                    location: "본관 9층 글로컬회의실",
                    totalMembers: 11,
                    present: 9,
                    absent: 2,
                    agendas: [
                        {
                            title: "제1호~3호 예산 및 추경 심의 (통합예산팀)",
                            summary: "사학연금 법인부담금 승인, 예산 전용 보고 및 라이즈(RISE) 사업(안경거리 조성 등)의 안정적 추진을 위한 토지 매입비가 포함된 제1차 교비회계 추가경정예산안을 원안 가결함."
                        },
                        {
                            title: "제4호~5호 결산 및 적립금 (재무팀)",
                            summary: "외부 회계 감사 결과 '적정' 의견 확인. 장학금 중심의 국고보조금 수입과 전체 예산 중 학생 경비 비중(약 45%)을 확인하였으며, 감가상각을 반영한 투명한 회계 처리 원칙을 재확인함."
                        },
                        {
                            title: "제6호 대구보건대학교 학칙 개정(안) 심의 (교무지원팀)",
                            summary: "2027학년도 물리치료학과 4년제 전면 전환 승인(과도기 학생을 위한 전공심화과정 병행). 스포츠재활학과의 명칭 변경, 글로벌호텔조리학과 폐지 및 파크골프 전담 학과 신설 등 학사 개편안을 가결함."
                        }
                    ]
                },
                {
                    id: 2,
                    title: "2026학년도 제2차 대구보건대학교평의원회",
                    date: "2026년 8월 28일(금)",
                    time: "10:00~11:00",
                    location: "본관 9층 글로컬회의실",
                    totalMembers: 11,
                    present: 7,
                    absent: 4,
                    agendas: [
                        {
                            title: "제1호 전공 교육과정 운영정책 및 편성지침 개정안 자문",
                            summary: "AI·DX 기반 교육과정 개편 트렌드 반영. 물리치료학과 4년제 전환에 따른 교육과정 정비와 더불어, 간호학과의 인증평가 기준에 맞춘 학점 및 임상실습(500시간 이상) 기준을 명확화하도록 자문함."
                        },
                        {
                            title: "제2호 대구보건대학교 학칙 개정(안) 심의",
                            summary: "정원외전형 세부 규정, 외국인 교환학생 유치 및 유학생 졸업 기준을 신설함. 글로벌호텔조리학과 전공명(외식·조리·베이커리) 변경 등을 포함한 학칙 개정안을 승인함."
                        },
                        {
                            title: "제3호 대학평의원회 구성원 추천 지침(안) 논의",
                            summary: "직원, 조교 등 평의원회 위원 추천에 대한 투명한 세부 지침 마련 필요성에 공감함. 후보 추천 주체 및 방식에 대해 설문으로 의견을 수집하고, 다음 3차 회의에서 다수결로 선정하기로 합의함."
                        }
                    ]
                }
            ]
            // "2027": [ ... ] 새로운 연도는 여기에 추가
        };

        let currentYear = "2026";
        let currentSession = 2; // Default to the latest session

        function renderSidebar() {
            const sidebar = document.getElementById('sidebarMenu');
            sidebar.innerHTML = '';

            const years = Object.keys(meetingData).sort((a, b) => b - a); // Descending

            years.forEach(year => {
                const yearBlock = document.createElement('div');
                yearBlock.className = 'mb-6';
                
                const yearTitle = document.createElement('h3');
                yearTitle.className = 'text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 ml-2 flex items-center gap-2';
                yearTitle.innerHTML = `<i class="fa-regular fa-calendar"></i> ${year}년도`;
                yearBlock.appendChild(yearTitle);

                const sessionList = document.createElement('ul');
                sessionList.className = 'space-y-1';

                meetingData[year].forEach(session => {
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    const isActive = (currentYear === year && currentSession === session.id);
                    
                    btn.className = `w-full text-left px-4 py-2.5 rounded-lg text-sm transition-colors flex items-center justify-between ${isActive ? 'bg-blue-600 text-white font-medium' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`;
                    btn.innerHTML = `
                        <div class="flex flex-col gap-0.5">
                            <span>제${session.id}차 회의록</span>
                            <span class="text-[11px] ${isActive ? 'text-blue-200' : 'text-slate-500'}">${session.date}</span>
                        </div>
                        ${isActive ? '<i class="fa-solid fa-chevron-right text-xs"></i>' : ''}
                    `;
                    
                    btn.onclick = () => {
                        currentYear = year;
                        currentSession = session.id;
                        renderSidebar(); // Update active state
                        renderContent(); // Update main content
                    };

                    li.appendChild(btn);
                    sessionList.appendChild(li);
                });

                yearBlock.appendChild(sessionList);
                sidebar.appendChild(yearBlock);
            });
        }

        function renderContent() {
            const contentArea = document.getElementById('mainContent');
            const headerTitle = document.getElementById('headerTitle');
            
            const yearData = meetingData[currentYear];
            if(!yearData) return;

            const session = yearData.find(s => s.id === currentSession);
            if(!session) return;

            // Update Header
            headerTitle.innerHTML = `<i class="fa-regular fa-calendar-check text-blue-500"></i> ${session.title}`;

            // Calculate Quorum Status (성원 기준: 과반수 이상 즉, 6명 이상)
            const quorumMet = session.present >= 6;
            const quorumBadge = quorumMet 
                ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800 border border-green-200"><i class="fa-solid fa-check"></i> 성원 됨 (과반수 충족)</span>`
                : `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-red-100 text-red-800 border border-red-200"><i class="fa-solid fa-xmark"></i> 성원 미달</span>`;

            // Build HTML
            let html = `
                <div class="max-w-4xl mx-auto fade-in pb-12">
                    
                    <!-- Meeting Overview Card -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6">
                        <div class="bg-blue-50 border-b border-gray-200 p-4 sm:p-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h3 class="text-lg font-bold text-gray-800 mb-2">회의 개요</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm text-gray-600">
                                    <div class="flex items-center gap-2">
                                        <i class="fa-regular fa-clock w-5 text-center text-blue-400"></i>
                                        <span><strong>일시:</strong> ${session.date} ${session.time}</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <i class="fa-solid fa-location-dot w-5 text-center text-blue-400"></i>
                                        <span><strong>장소:</strong> ${session.location}</span>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Dynamic Link Button -->
                            <a href="./${currentYear}_${String(session.id).padStart(2, '0')}.html" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors shadow-sm w-full sm:w-auto">
                                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                                ${currentYear}년 ${session.id}차 안건 안내
                            </a>
                        </div>
                        
                        <div class="p-4 sm:p-6 bg-white">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4">
                                <h4 class="font-semibold text-gray-700 mb-2 sm:mb-0">참석 현황</h4>
                                <div>${quorumBadge}</div>
                            </div>
                            
                            <!-- Attendees Stats -->
                            <div class="grid grid-cols-3 gap-4 text-center">
                                <div class="bg-gray-50 rounded-lg p-3 border border-gray-100">
                                    <p class="text-xs text-gray-500 mb-1">총원</p>
                                    <p class="text-xl font-bold text-gray-800">${session.totalMembers}명</p>
                                </div>
                                <div class="bg-blue-50 rounded-lg p-3 border border-blue-100">
                                    <p class="text-xs text-blue-600 mb-1">참석</p>
                                    <p class="text-xl font-bold text-blue-700">${session.present}명</p>
                                </div>
                                <div class="bg-red-50 rounded-lg p-3 border border-red-100">
                                    <p class="text-xs text-red-600 mb-1">불참</p>
                                    <p class="text-xl font-bold text-red-700">${session.absent}명</p>
                                </div>
                            </div>
                            <p class="text-xs text-gray-500 mt-3 flex items-start gap-1">
                                <i class="fa-solid fa-circle-info mt-0.5"></i>
                                <span>* 총원 ${session.totalMembers}명 중 과반수 이상(6명 이상) 참석 시 성원되어 회의 개최가 가능합니다.</span>
                            </p>
                        </div>
                    </div>

                    <!-- Agenda Items -->
                    <h3 class="text-lg font-bold text-gray-800 mb-4 pl-1 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 안건별 요약 내용
                    </h3>
                    
                    <div class="space-y-4">
            `;

            session.agendas.forEach((agenda, index) => {
                html += `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 sm:p-6 hover:shadow-md transition-shadow flex flex-col sm:flex-row gap-4 sm:gap-6">
                            <div class="flex-shrink-0">
                                <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">
                                    ${index + 1}
                                </div>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-800 text-md mb-2 leading-tight">${agenda.title}</h4>
                                <p class="text-sm text-gray-600 leading-relaxed bg-gray-50 p-4 rounded-lg border border-gray-100">
                                    ${agenda.summary}
                                </p>
                            </div>
                        </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            contentArea.innerHTML = html;
        }

        // Initialize the app on load
        window.onload = () => {
            renderSidebar();
            renderContent();
        };
    </script>
</body>
</html>
